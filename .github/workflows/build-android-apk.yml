name: Build APK

# یک workflow ساده — بدون assert سخت، با ساخت Gradle Wrapper در CI
on:
  workflow_dispatch:
    inputs:
      note:
        description: "note"
        required: false
        default: "build"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Launcher icon
        run: python3 scripts/install_android_icon.py

      - name: Merge content packs (best effort)
        run: |
          set +e
          python3 scripts/export_android_index.py
          EXPORT=$?
          python3 scripts/merge_content_packs_into_android.py
          MERGE=$?
          echo "export_exit=$EXPORT merge_exit=$MERGE"
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          if p.is_file():
              d = json.loads(gzip.open(p, "rt", encoding="utf-8").read())
              print("curriculum chapters", len(d.get("chapters") or []), "lessons", d.get("lesson_count"))
          else:
              print("WARN no curriculum gz — APK may have empty catalog")
          PY
          # محتوا مهم است ولی نباید کل بیلد APK را بکشد
          exit 0

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          set -e
          curl -fsSL -o /tmp/gradle-8.2-bin.zip \
            https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/gradle-8.2-bin.zip -d /opt
          /opt/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EngineerJokar-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
