name: Build Android APK (دستی)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "یادداشت"
        required: false
        default: "manual"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install launcher icon
        run: python3 scripts/install_android_icon.py

      - name: Export curriculum + merge packs
        run: |
          set -e
          python3 scripts/export_android_index.py
          python3 scripts/merge_content_packs_into_android.py
          python3 - <<'PY'
          import gzip, json, sys
          from pathlib import Path
          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          if not p.is_file():
              print("ERROR missing curriculum gz")
              sys.exit(1)
          d = json.loads(gzip.open(p, "rt", encoding="utf-8").read())
          orders = [int(c.get("order") or 0) for c in d.get("chapters") or []]
          nch = len(orders)
          nles = int(d.get("lesson_count") or 0)
          print("chapters", nch, "lessons", nles)
          print("orders tail", sorted(orders)[-8:])
          if nch < 60:
              print("ERROR too few chapters", nch)
              sys.exit(1)
          if nles < 4000:
              print("ERROR too few lessons", nles)
              sys.exit(1)
          if 64 not in orders:
              print("WARN chapter 64 missing after merge — non-fatal")
          print("verify OK")
          PY

      - name: Ensure Gradle Wrapper
        working-directory: android
        run: |
          set -e
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew"
          fi
          if [ ! -f gradlew.bat ]; then
            curl -fsSL -o gradlew.bat \
              "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew.bat"
          fi
          chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -path "*/outputs/*" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkEncyclopedia-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
