name: Build APK v1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK licenses + platform
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f51874764545162ea396f5d536e251650e41b" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/tmp/sdk-lic.txt 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/tmp/sdk-install.txt 2>&1 || true
          tail -30 /tmp/sdk-install.txt || true

      - name: Icons
        run: python3 scripts/install_android_icon.py

      # Keep the same chapter 56-59 validator in the offline Android build path.
      - name: Validate chapters 56-59 shared content
        run: python3 tools/validate_ch56_59_packs.py

      - name: Validate chapters 60-68 shared content
        run: python3 tools/validate_ch60_68_pack.py

      - name: Chapters 1-68 export
        run: |
          set -e
          python3 scripts/export_android_index.py
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          d = json.loads(gzip.open(p, "rt", encoding="utf-8").read())
          orders = [int(c["order"]) for c in d["chapters"]]
          print("export chapters", len(orders), "lessons", d["lesson_count"])
          assert 1 in orders and 68 in orders
          PY

      - name: Merge content packs (required)
        run: |
          set -euo pipefail
          python3 scripts/merge_content_packs_into_android.py

      - name: Validate final curriculum asset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path

          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          if not p.is_file() or p.stat().st_size < 1024:
              raise SystemExit(f"ERROR: missing or suspiciously small curriculum asset: {p}")
          with gzip.open(p, "rt", encoding="utf-8") as f:
              d = json.load(f)

          chapters = d.get("chapters")
          if not isinstance(chapters, list) or not chapters:
              raise SystemExit("ERROR: chapters must be a non-empty list")
          orders = [int(c["order"]) for c in chapters]
          if len(orders) != len(set(orders)):
              raise SystemExit("ERROR: duplicate chapter order")
          if 1 not in orders or 68 not in orders:
              raise SystemExit(f"ERROR: required chapters 1 and 68 missing; found {orders}")

          lessons = [
              lesson
              for chapter in chapters
              for sub in chapter.get("subchapters", [])
              for lesson in sub.get("lessons", [])
          ]
          if int(d.get("lesson_count", -1)) != len(lessons):
              raise SystemExit(
                  f"ERROR: lesson_count={d.get('lesson_count')} but actual={len(lessons)}"
              )
          uids = [lesson.get("uid") for lesson in lessons]
          if any(not uid for uid in uids):
              raise SystemExit("ERROR: at least one lesson has no uid")
          if len(uids) != len(set(uids)):
              raise SystemExit("ERROR: duplicate lesson uid detected")

          ch68 = next(c for c in chapters if int(c["order"]) == 68)
          ch68_count = sum(len(s.get("lessons", [])) for s in ch68.get("subchapters", []))
          if ch68_count == 0:
              raise SystemExit("ERROR: chapter 68 contains no lessons")

          print(f"VALID curriculum: chapters={len(chapters)} lessons={len(lessons)} "
                f"chapter68_lessons={ch68_count} version={d.get('version')} "
                f"gzip_bytes={p.stat().st_size}")
          PY

      - name: Gradle wrapper + local.properties
        working-directory: android
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -qo /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Assemble APK
        id: assemble
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-assemble.log
        continue-on-error: true

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Upload APK or fail
        run: |
          set -e
          APK=$(find android -name "*.apk" -path "*/outputs/*" | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "APK missing — see artifact gradle-assemble-log"
            tail -80 /tmp/gradle-assemble.log || true
            exit 1
          fi
          echo "APK=$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: EngineerJokar-APK-v1
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
