name: NetworkAll Android APK (validated)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-repair-port86-20261013
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK licenses + platform
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f51874764545162ea396f5d536e251650e41b" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/tmp/sdk-lic.txt 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/tmp/sdk-install.txt 2>&1 || true
          tail -30 /tmp/sdk-install.txt || true

      - name: Icons
        run: python3 scripts/install_android_icon.py

      - name: Validate per-chapter prompt tree
        run: |
          set -euo pipefail
          python3 -m py_compile tools/chapter_prompts/generate_chapter_prompts.py
          python3 tools/chapter_prompts/generate_chapter_prompts.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("tools/chapter_prompts")
          prompts = sorted(root.glob("ch[0-9][0-9]/PROMPT.md"))
          templates = sorted(root.glob("ch[0-9][0-9]/PACK_TEMPLATE.json"))
          assert len(prompts) == 68, f"Expected 68 chapter prompts, found {len(prompts)}"
          assert len(templates) == 68, f"Expected 68 starter templates, found {len(templates)}"
          for prompt in prompts:
              chapter = prompt.parent.name
              json.loads((prompt.parent / "PACK_TEMPLATE.json").read_text(encoding="utf-8"))
              text = prompt.read_text(encoding="utf-8")
              assert ("50" in text or "۵۰" in text) and "answer_key" in text, f"Incomplete enrichment prompt: {chapter}"
          index = (root / "INDEX.md").read_text(encoding="utf-8")
          assert all(f"ch{i:02d}/PROMPT.md" in index for i in range(1, 69)), "Chapter index is incomplete"
          print(f"Chapter prompts validated: {len(prompts)} folders, {len(templates)} JSON templates")
          PY

      - name: Chapters 1-68 export
        run: |
          set -e
          python3 scripts/export_android_index.py
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          d = json.loads(gzip.open(p, "rt", encoding="utf-8").read())
          orders = [int(c["order"]) for c in d["chapters"]]
          print("export chapters", len(orders), "lessons", d["lesson_count"])
          assert 1 in orders and 68 in orders
          PY

      - name: Merge content packs (required)
        run: |
          set -euo pipefail
          python3 scripts/merge_content_packs_into_android.py

      - name: Validate Chapter 1 pack and merged UID mapping
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_chapter_pack.py
          python3 scripts/validate_chapter_pack.py

      - name: Validate final NetworkAll curriculum
        run: |
          set -euo pipefail
          python3 scripts/validate_android_curriculum.py

      - name: Generate 100 SVG diagrams for Android and Windows web
        run: |
          set -euo pipefail
          python3 scripts/generate_android_diagrams.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("android/app/src/main/assets/diagrams")
          web_root = Path("server/static/diagrams")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          web_index = json.loads((web_root / "index.json").read_text(encoding="utf-8"))
          ch1 = json.loads((root / "ch01" / "index.json").read_text(encoding="utf-8"))
          web_ch1 = json.loads((web_root / "ch01" / "index.json").read_text(encoding="utf-8"))
          combined = json.loads((root / "combined_index.json").read_text(encoding="utf-8"))
          web_combined = json.loads((web_root / "combined_index.json").read_text(encoding="utf-8"))
          assert index["count"] == 100 and len(index["diagrams"]) == 100
          assert web_index["count"] == 100 and len(web_index["diagrams"]) == 100
          assert ch1["count"] == 41 and len(ch1["diagrams"]) == 41
          assert web_ch1["count"] == 41 and len(web_ch1["diagrams"]) == 41
          assert combined["count"] == 141 and len(combined["diagrams"]) == 141
          assert web_combined["count"] == 141 and len(web_combined["diagrams"]) == 141
          assert all((root / x["asset"]).is_file() for x in index["diagrams"])
          assert all((web_root / x["asset"]).is_file() for x in web_index["diagrams"])
          assert {x["asset"] for x in index["diagrams"]} == {x["asset"] for x in web_index["diagrams"]}
          print("Android diagrams", index["count"], "bytes", sum(p.stat().st_size for p in root.glob("*.svg")))
          print("Windows web diagrams", web_index["count"], "bytes", sum(p.stat().st_size for p in web_root.glob("*.svg")))
          PY

      - name: Build and audit Windows v1 package
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r server/requirements.txt
          python3 -m py_compile \
            server/app.py server/core/db.py server/workspace_routes.py \
            scripts/export_android_index.py \
            scripts/merge_content_packs_into_android.py \
            scripts/validate_android_curriculum.py \
            scripts/validate_chapter_pack.py \
            scripts/generate_android_diagrams.py \
            scripts/smoke_test_windows_seed.py \
            scripts/smoke_test_vault_crypto.py \
            scripts/smoke_test_web_routes.py \
            scripts/package_windows_v1.py \
            scripts/validate_release_metadata.py \
            tools/chapter_prompts/generate_chapter_prompts.py \
            tools/chapter_git_teacher.py
          node --check server/static/app.js
          node --check server/static/sync_ui.js
          python3 scripts/validate_release_metadata.py
          python3 scripts/smoke_test_windows_seed.py
          python3 scripts/smoke_test_vault_crypto.py
          python3 scripts/smoke_test_web_routes.py
          python3 scripts/package_windows_v1.py
          ls -lh dist/NetworkAll-Windows-v1.0.0.zip

      - name: Gradle wrapper + local.properties
        working-directory: android
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -qo /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Assemble APK
        id: assemble
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-assemble.log
 
      - name: Audit packaged APK contents and size
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, zipfile
          from pathlib import Path
          out_dir = Path("android/app/build/outputs/apk")
          # Never accidentally audit the androidTest APK; it has a different
          # manifest and normally does not contain the app's offline assets.
          preferred = out_dir / "debug" / "app-debug.apk"
          apks = sorted(p for p in out_dir.rglob("*.apk") if "androidTest" not in p.parts and "test" not in p.name.lower())
          if preferred.is_file():
              apk = preferred
          elif apks:
              apk = apks[0]
          else:
              raise SystemExit(f"No application APK found under {out_dir}")
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              # Android assets may be packaged as plain JSON or gzip. OfflineSeeder
              # supports both, so the audit must validate either supported form.
              curriculum_candidates = (
                  "assets/curriculum_index.json",
                  "assets/curriculum_index.json.gz",
              )
              curriculum_path = next((p for p in curriculum_candidates if p in names), None)
              diagram_index_path = "assets/diagrams/index.json"
              if curriculum_path is None:
                  raise SystemExit(
                      f"APK {apk.name} missing curriculum_index.json[.gz]; "
                      f"assets found: {[n for n in sorted(names) if n.startswith('assets/')][:60]}"
                  )
              if diagram_index_path not in names:
                  raise SystemExit(f"APK {apk.name} missing {diagram_index_path}; assets found: {[n for n in sorted(names) if n.startswith('assets/')][:60]}")
              curriculum_bytes = z.read(curriculum_path)
              if curriculum_path.endswith(".gz"):
                  curriculum_bytes = gzip.decompress(curriculum_bytes)
              curriculum = json.loads(curriculum_bytes.decode("utf-8"))
              diagrams = json.loads(z.read(diagram_index_path))
              svg_count = sum(1 for n in names if n.startswith("assets/diagrams/diagram_") and n.endswith(".svg"))
              chapter1_svg_count = sum(1 for n in names if n.startswith("assets/diagrams/ch01/") and n.endswith(".svg"))
              if "assets/diagrams/ch01/index.json" not in names or "assets/diagrams/combined_index.json" not in names:
                  raise SystemExit("APK missing Chapter 1 / combined diagram indexes")
              ch1_diagrams = json.loads(z.read("assets/diagrams/ch01/index.json"))
              combined_diagrams = json.loads(z.read("assets/diagrams/combined_index.json"))
              actual_lessons = sum(len(s.get("lessons", [])) for ch in curriculum["chapters"] for s in ch.get("subchapters", []))
              orders = {int(ch.get("order", -1)) for ch in curriculum["chapters"]}
              assert len(curriculum["chapters"]) == 68 and set(range(1, 69)).issubset(orders), f"APK chapter coverage mismatch: {sorted(orders)}"
              assert curriculum["lesson_count"] == actual_lessons, f"APK lesson_count mismatch: declared={curriculum['lesson_count']} actual={actual_lessons}"
              assert diagrams.get("count") == 100 and svg_count == 100, f"APK diagram count mismatch: index={diagrams.get('count')} svg={svg_count}"
              assert ch1_diagrams.get("count") == 41 and chapter1_svg_count == 41, f"Chapter 1 diagram count mismatch: index={ch1_diagrams.get('count')} svg={chapter1_svg_count}"
              assert combined_diagrams.get("count") == 141, f"Combined diagram count mismatch: {combined_diagrams.get('count')}"
              chapter68 = next((ch for ch in curriculum["chapters"] if int(ch.get("order", -1)) == 68), None)
              assert chapter68 and chapter68.get("subchapters"), "Chapter 68 has no collections"
              print("APK asset audit details:", {"apk": str(apk), "apk_bytes": apk.stat().st_size, "lessons": actual_lessons, "svg_count": svg_count, "asset_entries": sum(n.startswith("assets/") for n in names)})
          print(f"APK AUDIT OK: {apk} bytes={apk.stat().st_size} chapters=68 lessons={curriculum['lesson_count']} diagrams={svg_count}")
          PY

      - name: Upload APK for diagnosis if audit fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAll-Android-diagnostic-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-assemble-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Verify application APK path
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "Application APK missing: $APK"
            echo "Do not substitute an androidTest APK."
            tail -100 /tmp/gradle-assemble.log || true
            exit 1
          fi
          echo "Application APK: $APK"
          ls -lh "$APK"

      - name: Upload NetworkAll Windows v1.0.0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAll-Windows-v1.0.0
          path: dist/NetworkAll-Windows-v1.0.0.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload NetworkAll Android v1.0.0
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAll-Android-v1.0.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
