name: Build APK v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3

      - name: Icons
        run: python3 scripts/install_android_icon.py

      - name: Chapters 1-68 export
        run: |
          set -e
          python3 scripts/export_android_index.py
          python3 - <<'PY'
          import gzip, json, sys
          from pathlib import Path
          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          d = json.loads(gzip.open(p, "rt", encoding="utf-8").read())
          orders = [int(c["order"]) for c in d["chapters"]]
          print("export chapters", len(orders), "lessons", d["lesson_count"])
          print("last", orders[-6:])
          assert 68 in orders and 1 in orders, orders[-10:]
          PY

      - name: Merge packs into 65-68 (best effort)
        run: |
          set +e
          python3 scripts/merge_content_packs_into_android.py
          echo "merge_exit=$?"
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          p = Path("android/app/src/main/assets/curriculum_index.json.gz")
          d = json.loads(gzip.open(p, "rt", encoding="utf-8").read())
          print("after merge chapters", len(d["chapters"]), "lessons", d["lesson_count"])
          PY
          exit 0

      - name: Gradle wrapper
        working-directory: android
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -qo /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EngineerJokar-APK-v1
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
