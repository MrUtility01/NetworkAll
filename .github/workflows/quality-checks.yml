name: Quality checks

on:
  push:
    branches:
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q server tools scripts tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit active curriculum and content packs
        run: python tools/audit_content_packs.py --json reports/content-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: networkall-content-audit
          path: reports/content-audit.json
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Build Android debug APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: networkall-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
