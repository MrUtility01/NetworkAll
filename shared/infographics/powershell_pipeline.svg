<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Pipeline در PowerShell</title><desc id="d">Objects از cmdlet اول به Where-Object و Sort-Object و Select-Object رفته و سپس به نمایش یا Export-Csv می‌رسند.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#557b9e"/></marker></defs><rect width="1200" height="680" rx="24" fill="#f4f8fd"/><text x="600" y="48" text-anchor="middle" font-size="30" font-family="Tahoma,Arial" font-weight="700" fill="#102f50">PowerShell Pipeline: عبور Objectها بین Cmdletها</text><text x="600" y="80" text-anchor="middle" font-size="17" font-family="Tahoma,Arial" fill="#5b7087">Pipeline عموماً object منتقل می‌کند، نه صرفاً متن چاپ‌شده؛ Format-* برای انتهای مسیر نمایش است.</text><g font-family="Tahoma,Arial"><rect x="35" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#1677b9" stroke-width="2"/><rect x="35" y="155" width="200" height="54" rx="14" fill="#1677b9"/><rect x="35" y="193" width="200" height="16" fill="#1677b9"/><text x="135" y="189" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Get-Process</text><text x="135" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">تولید Objectها</text><text x="135" y="288" text-anchor="middle" font-size="16" fill="#536c84">Process</text></g><g font-family="Tahoma,Arial"><rect x="270" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#0c8b82" stroke-width="2"/><rect x="270" y="155" width="200" height="54" rx="14" fill="#0c8b82"/><rect x="270" y="193" width="200" height="16" fill="#0c8b82"/><text x="370" y="189" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Where-Object</text><text x="370" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">فیلتر</text><text x="370" y="288" text-anchor="middle" font-size="16" fill="#536c84">CPU / Name</text></g><g font-family="Tahoma,Arial"><rect x="505" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#d27a1b" stroke-width="2"/><rect x="505" y="155" width="200" height="54" rx="14" fill="#d27a1b"/><rect x="505" y="193" width="200" height="16" fill="#d27a1b"/><text x="605" y="189" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Sort-Object</text><text x="605" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">مرتب‌سازی</text><text x="605" y="288" text-anchor="middle" font-size="16" fill="#536c84">Descending</text></g><g font-family="Tahoma,Arial"><rect x="740" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#7655ba" stroke-width="2"/><rect x="740" y="155" width="200" height="54" rx="14" fill="#7655ba"/><rect x="740" y="193" width="200" height="16" fill="#7655ba"/><text x="840" y="189" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Select-Object</text><text x="840" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">انتخاب فیلد</text><text x="840" y="288" text-anchor="middle" font-size="16" fill="#536c84">Name / CPU</text></g><g font-family="Tahoma,Arial"><rect x="975" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#16814f" stroke-width="2"/><rect x="975" y="155" width="200" height="54" rx="14" fill="#16814f"/><rect x="975" y="193" width="200" height="16" fill="#16814f"/><text x="1075" y="189" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">Export-Csv</text><text x="1075" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">خروجی داده</text><text x="1075" y="288" text-anchor="middle" font-size="16" fill="#536c84">Machine-readable</text></g><line x1="235" y1="244" x2="263" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="470" y1="244" x2="498" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="705" y1="244" x2="733" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="940" y1="244" x2="968" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="380" width="1130" height="238" rx="18" fill="#fff" stroke="#d6e3ef"/><g font-family="Tahoma,Arial"><text x="600" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#153958">نمونهٔ عملی و نکته‌های حرفه‌ای</text><text x="70" y="462" font-size="17" fill="#234867">Get-Process | Where-Object CPU -gt 10 | Sort-Object CPU -Descending | Select-Object -First 10</text><text x="70" y="503" font-size="17" fill="#234867">• خطاها: -ErrorAction Stop برای flow control؛ try/catch فقط خطاهای terminating را می‌گیرد.</text><text x="70" y="544" font-size="17" fill="#234867">• Export-Csv باید objectها را بگیرد؛ Format-Table را قبل از export قرار ندهید.</text><text x="70" y="585" font-size="17" fill="#234867">• برای automation، ورودی را validate کنید، خروجی را type-aware نگه دارید و نتیجه را با exit code/log بررسی کنید.</text><text x="600" y="647" text-anchor="middle" font-size="16" fill="#61768d">اسکریپت عملیاتی باید idempotency، حداقل دسترسی، logging و rollback متناسب با کار داشته باشد.</text></g></svg>