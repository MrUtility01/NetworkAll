<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">RouterOS QoS queues and congestion point</title><desc id="desc">Traffic classes are classified and shaped through Simple Queue or Queue Tree/PCQ before a constrained WAN link; FastTrack may bypass some queue or mangle paths depending on release and queue configuration.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker></defs><rect width="1400" height="820" rx="26" fill="#f2f7fc"/><rect x="28" y="24" width="1344" height="88" rx="18" fill="#0d3158"/><text x="1335" y="62" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">RouterOS QoS — از Classification تا Bottleneck</text><text x="1335" y="91" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#d6eaff">QoS پهنای باند نمی‌سازد؛ رفتار صف را در نقطهٔ ازدحام کنترل می‌کند.</text>
<rect x="55" y="165" width="260" height="145" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="185" y="202" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#17496c">Traffic mix</text><text x="185" y="235" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#17496c">Voice / Interactive</text><text x="185" y="265" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#17496c">Bulk / Best effort</text><text x="185" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#52708a">Client, address, DSCP, marks</text>
<rect x="370" y="165" width="260" height="145" rx="16" fill="#fff4dd" stroke="#d6ab46" stroke-width="2"/><text x="500" y="202" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#6e4f14">Classification</text><text x="500" y="235" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#6e4f14">Mangle / DSCP / target</text><text x="500" y="266" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#876924">Connection/packet marks</text><text x="500" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#876924">Version &amp; order matter</text>
<rect x="685" y="165" width="300" height="145" rx="16" fill="#e1f6e9" stroke="#16835d" stroke-width="2"/><text x="835" y="202" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#15583f">Queue policy</text><text x="835" y="235" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#15583f">Simple Queue / PCQ</text><text x="835" y="265" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#15583f">Queue Tree / HTB</text><text x="835" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#527d6b">Rate / priority / parent</text>
<rect x="1040" y="165" width="305" height="145" rx="16" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="1192" y="202" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#593579">WAN bottleneck</text><text x="1192" y="235" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#593579">Limited link / queue</text><text x="1192" y="265" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#74588e">Upload and download differ</text><text x="1192" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#74588e">Measure before tuning</text>
<path d="M315 238 L370 238 M630 238 L685 238 M985 238 L1040 238" stroke="#2477b7" stroke-width="4" marker-end="url(#arr)"/>
<rect x="70" y="365" width="600" height="175" rx="16" fill="#fff" stroke="#cbddea" stroke-width="2"/><text x="640" y="405" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#163e62">انتخاب روش Queue</text><text x="640" y="441" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">Simple Queue: سیاست مستقیم برای target/rate</text><text x="640" y="472" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">PCQ: تقسیم جریان‌ها بر اساس classifier انتخابی</text><text x="640" y="503" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">Queue Tree/HTB: طبقه‌بندی سلسله‌مراتبی و priority</text><text x="640" y="528" text-anchor="end" font-family="Tahoma,sans-serif" font-size="14" fill="#647b90">Parent، interface، mark و ترتیب پردازش باید verify شوند.</text>
<rect x="710" y="365" width="620" height="175" rx="16" fill="#ffeded" stroke="#c74c4c" stroke-width="2"/><text x="1300" y="405" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#8e2b2b">FastTrack caveat</text><text x="1300" y="441" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#8e2b2b">FastTrack ممکن است بعضی queue/mangle/accounting pathها را bypass کند.</text><text x="1300" y="472" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#8e2b2b">اثر دقیق به RouterOS release، نوع queue و parent وابسته است.</text><text x="1300" y="503" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#8e2b2b">قبل/بعد را با counters و mixed traffic بسنج؛ یک speedtest کافی نیست.</text>
<rect x="70" y="590" width="1260" height="150" rx="16" fill="#fff" stroke="#cbddea" stroke-width="2"/><text x="1300" y="628" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#163e62">Acceptance test</text><text x="1300" y="663" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">۱) چند client و flow هم‌زمان  ۲) mixed upload/download  ۳) p95/p99 latency  ۴) jitter/loss  ۵) queue drop/counters</text><text x="1300" y="696" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">۶) FastTrack ON/OFF طبق design  ۷) rollback و تکرار معیارها  ۸) ثبت model/version و حدود ابزار اندازه‌گیری</text><text x="1300" y="725" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#647b90">Thresholdها را از baseline و SLO همان سرویس انتخاب کن؛ عدد عمومی برای همهٔ روترها معتبر نیست.</text></svg>