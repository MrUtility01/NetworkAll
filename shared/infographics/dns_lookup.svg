<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 730" role="img" aria-labelledby="t d">
<title id="t">جست‌وجوی DNS از Client تا Authoritative</title><desc id="d">در cache miss، resolver بازگشتی Root، TLD و authoritative را دنبال کرده، پاسخ را کش می‌کند و به کلاینت برمی‌گرداند.</desc>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#4a759a"/></marker></defs><rect width="1300" height="730" rx="24" fill="#f4f8fd"/><text x="650" y="48" text-anchor="middle" font-family="Tahoma,Arial" font-size="30" font-weight="700" fill="#102f50">DNS Resolution: نام چگونه به IP می‌رسد؟</text><text x="650" y="81" text-anchor="middle" font-family="Tahoma,Arial" font-size="17" fill="#5d7288">در صورت cache hit، پاسخ سریع‌تر است و ممکن است هیچ پرس‌وجوی بیرونی رخ ندهد.</text>
<g font-family="Tahoma,Arial"><rect x="42" y="160" width="210" height="100" rx="15" fill="#e4f2ff" stroke="#9dc9ee"/><text x="147" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#12558c">Client / Stub</text><text x="147" y="229" text-anchor="middle" font-size="16" fill="#345a77">OS / App cache</text>
<rect x="300" y="160" width="210" height="100" rx="15" fill="#e8f8ee" stroke="#a9dfbf"/><text x="405" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#176c43">Recursive</text><text x="405" y="229" text-anchor="middle" font-size="16" fill="#345a77">ISP / Enterprise</text>
<rect x="558" y="160" width="190" height="100" rx="15" fill="#fff3e6" stroke="#f0d0ab"/><text x="653" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#9e5715">Root DNS</text><text x="653" y="229" text-anchor="middle" font-size="16" fill="#345a77">Delegation</text>
<rect x="796" y="160" width="190" height="100" rx="15" fill="#f0ebff" stroke="#d2c5f4"/><text x="891" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#6545a7">TLD DNS</text><text x="891" y="229" text-anchor="middle" font-size="16" fill="#345a77">مثلاً .com</text>
<rect x="1034" y="160" width="224" height="100" rx="15" fill="#e1f5f8" stroke="#a3dce2"/><text x="1146" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#126d7b">Authoritative</text><text x="1146" y="229" text-anchor="middle" font-size="16" fill="#345a77">Zone / Record</text>
<line x1="252" y1="194" x2="294" y2="194" stroke="#4a759a" stroke-width="3" marker-end="url(#m)"/><line x1="510" y1="194" x2="552" y2="194" stroke="#4a759a" stroke-width="3" marker-end="url(#m)"/><line x1="748" y1="194" x2="790" y2="194" stroke="#4a759a" stroke-width="3" marker-end="url(#m)"/><line x1="986" y1="194" x2="1028" y2="194" stroke="#4a759a" stroke-width="3" marker-end="url(#m)"/>
<text x="650" y="310" text-anchor="middle" font-size="17" fill="#4e6984">Resolver بازگشتی پاسخ/ارجاع‌ها را دریافت می‌کند؛ سپس نتیجه را طبق TTL کش می‌کند.</text>
<path d="M1146 345 L1146 390 L405 390 L405 345" fill="none" stroke="#168a61" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#m)"/><text x="770" y="378" text-anchor="middle" font-size="16" fill="#176c43">پاسخ authoritative یا referral به resolver</text>
<path d="M405 430 L405 490 L147 490 L147 430" fill="none" stroke="#176eb2" stroke-width="3" marker-end="url(#m)"/><text x="280" y="475" text-anchor="middle" font-size="16" fill="#12558c">پاسخ به Client + cache TTL</text>
<rect x="42" y="535" width="1216" height="150" rx="16" fill="#fff" stroke="#d7e3ef"/><text x="650" y="570" text-anchor="middle" font-size="21" font-weight="700" fill="#153958">چک‌لیست عیب‌یابی DNS</text><text x="650" y="607" text-anchor="middle" font-size="17" fill="#365675">۱) نام و suffix  ·  ۲) resolver و cache  ·  ۳) A/AAAA/CNAME و TTL  ·  ۴) delegation و authoritative</text><text x="650" y="640" text-anchor="middle" font-size="17" fill="#365675">۵) UDP/TCP 53، split DNS، DNSSEC، DoT/DoH در صورت استفاده  ·  ۶) مقایسه با اتصال مستقیم IP</text><text x="650" y="668" text-anchor="middle" font-size="15" fill="#61768d">ابزارها: nslookup, dig, Resolve-DnsName؛ هرکدام پرس‌وجو را در بافت resolver متفاوتی انجام می‌دهند.</text></g></svg>