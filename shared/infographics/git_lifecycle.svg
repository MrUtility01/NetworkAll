<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">چرخهٔ کاری Git</title><desc id="d">تغییر working tree، stage در index، commit محلی، push به remote و pull/fetch و بازبینی pull request.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#557b9e"/></marker></defs><rect width="1200" height="680" rx="24" fill="#f4f8fd"/><text x="600" y="48" text-anchor="middle" font-size="30" font-family="Tahoma,Arial" font-weight="700" fill="#102f50">Git: از فایل تغییرکرده تا تاریخچهٔ قابل‌بازبینی</text><text x="600" y="80" text-anchor="middle" font-size="17" font-family="Tahoma,Arial" fill="#5b7087">Commit محلی است؛ تا push انجام نشود، لزوماً روی remote یا GitHub وجود ندارد.</text><g font-family="Tahoma,Arial"><rect x="35" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#1677b9" stroke-width="2"/><rect x="35" y="155" width="200" height="54" rx="14" fill="#1677b9"/><rect x="35" y="193" width="200" height="16" fill="#1677b9"/><text x="135" y="189" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Working Tree</text><text x="135" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">ویرایش فایل</text><text x="135" y="288" text-anchor="middle" font-size="17" fill="#536c84">git diff</text></g><g font-family="Tahoma,Arial"><rect x="270" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#0c8b82" stroke-width="2"/><rect x="270" y="155" width="200" height="54" rx="14" fill="#0c8b82"/><rect x="270" y="193" width="200" height="16" fill="#0c8b82"/><text x="370" y="189" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Index / Stage</text><text x="370" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">انتخاب تغییرها</text><text x="370" y="288" text-anchor="middle" font-size="17" fill="#536c84">git add</text></g><g font-family="Tahoma,Arial"><rect x="505" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#d27a1b" stroke-width="2"/><rect x="505" y="155" width="200" height="54" rx="14" fill="#d27a1b"/><rect x="505" y="193" width="200" height="16" fill="#d27a1b"/><text x="605" y="189" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Local Commit</text><text x="605" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">ثبت snapshot</text><text x="605" y="288" text-anchor="middle" font-size="17" fill="#536c84">git commit</text></g><g font-family="Tahoma,Arial"><rect x="740" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#7655ba" stroke-width="2"/><rect x="740" y="155" width="200" height="54" rx="14" fill="#7655ba"/><rect x="740" y="193" width="200" height="16" fill="#7655ba"/><text x="840" y="189" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Remote Branch</text><text x="840" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">ارسال تاریخچه</text><text x="840" y="288" text-anchor="middle" font-size="17" fill="#536c84">git push</text></g><g font-family="Tahoma,Arial"><rect x="975" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#16814f" stroke-width="2"/><rect x="975" y="155" width="200" height="54" rx="14" fill="#16814f"/><rect x="975" y="193" width="200" height="16" fill="#16814f"/><text x="1075" y="189" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">Review / PR</text><text x="1075" y="249" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">بررسی و CI</text><text x="1075" y="288" text-anchor="middle" font-size="17" fill="#536c84">merge policy</text></g><line x1="235" y1="244" x2="263" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="470" y1="244" x2="498" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="705" y1="244" x2="733" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="940" y1="244" x2="968" y2="244" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="380" width="1130" height="238" rx="18" fill="#fff" stroke="#d6e3ef"/><g font-family="Tahoma,Arial"><text x="600" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#153958">ابزار درست برای هر کار</text><text x="70" y="462" font-size="17" fill="#234867">• git status / git diff / git diff --staged : بفهمید چه چیزی تغییر می‌کند و چه چیزی commit خواهد شد.</text><text x="70" y="503" font-size="17" fill="#234867">• git fetch : اطلاعات remote را می‌گیرد، اما شاخهٔ کاری را خودکار merge نمی‌کند.</text><text x="70" y="544" font-size="17" fill="#234867">• git revert : با commit جدید تغییر را خنثی می‌کند؛ برای تاریخچهٔ مشترک معمولاً امن‌تر است.</text><text x="70" y="585" font-size="17" fill="#234867">• git reset جابه‌جایی شاخه و احتمالاً index/working tree را تغییر می‌دهد؛ قبل از آن backup و status لازم است.</text><text x="600" y="647" text-anchor="middle" font-size="16" fill="#61768d">قبل از push، secretها، tokenها، دیتابیس شخصی و artifactهای حجیم را با git diff و ignore rules کنترل کنید.</text></g></svg>