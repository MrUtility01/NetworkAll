<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="t d">
<title id="t">Fiber optic link budget and acceptance test</title><desc id="d">A duplex optical link from transmitter through patch panels, connector pairs, splice and fiber to receiver. The bottom section explains link budget and distinguishes DOM, OLTS and OTDR.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2776b7"/></marker></defs>
<rect width="1440" height="820" rx="28" fill="#f3f7fb"/><rect x="32" y="28" width="1376" height="92" rx="18" fill="#12365a"/>
<text x="1368" y="65" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">مهندسی لینک فیبر: Budget، Polarity و تست</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d9eaff">Link up به‌تنهایی قبولی کانال یا کافی بودن optical margin را ثابت نمی‌کند.</text>
<rect x="55" y="175" width="205" height="115" rx="15" fill="#dceeff" stroke="#2776b7" stroke-width="2"/><text x="157" y="216" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#174c73">Tx Optic</text><text x="157" y="248" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#174c73">Tx min/max power</text><text x="157" y="272" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#174c73">wavelength · rate</text>
<rect x="340" y="175" width="205" height="115" rx="15" fill="#fff3db" stroke="#d9ad49" stroke-width="2"/><text x="442" y="216" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#76520d">Patch Panel A</text><text x="442" y="248" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#76520d">Connector pair</text><text x="442" y="272" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#76520d">clean / inspect</text>
<rect x="625" y="175" width="205" height="115" rx="15" fill="#e2f6ec" stroke="#16845e" stroke-width="2"/><text x="727" y="216" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#155b42">Fiber Route</text><text x="727" y="248" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#155b42">attenuation / bends</text><text x="727" y="272" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#155b42">splices / length</text>
<rect x="910" y="175" width="205" height="115" rx="15" fill="#fff3db" stroke="#d9ad49" stroke-width="2"/><text x="1012" y="216" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#76520d">Patch Panel B</text><text x="1012" y="248" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#76520d">Polarity A/B</text><text x="1012" y="272" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#76520d">connector / adapter</text>
<rect x="1195" y="175" width="190" height="115" rx="15" fill="#e9e4ff" stroke="#8065b2" stroke-width="2"/><text x="1290" y="216" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#4f3a83">Rx Optic</text><text x="1290" y="248" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#4f3a83">Sensitivity</text><text x="1290" y="272" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#4f3a83">overload max</text>
<path d="M260 233 L340 233 M545 233 L625 233 M830 233 L910 233 M1115 233 L1195 233" stroke="#2776b7" stroke-width="4" marker-end="url(#arr)"/>
<rect x="60" y="340" width="1320" height="165" rx="18" fill="#fff" stroke="#c9d9e8" stroke-width="2"/><text x="1340" y="380" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#173f62">بودجهٔ نوری و polarity</text><text x="1340" y="418" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" fill="#294d6c">Loss total = fiber attenuation + connector pairs + splices + passive components + other specified losses</text><text x="1340" y="452" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" fill="#294d6c">Available budget را با Tx minimum، Rx sensitivity و Rx overload در دیتاشیت همان optic مقایسه کن.</text><text x="1340" y="482" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#61788b">عدد reach یا loss عمومی را به مدل ناشناخته تعمیم نده؛ هر جهت و هر wavelength ممکن است متفاوت باشد.</text>
<rect x="60" y="535" width="410" height="190" rx="16" fill="#e0f1ff" stroke="#2776b7" stroke-width="2"/><text x="440" y="575" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#174c73">DOM / DDM</text><text x="440" y="610" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#174c73">Snapshot توان/دمای ماژول در صورت پشتیبانی.</text><text x="440" y="642" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#174c73">تله‌متری مفید؛ لزوماً تست calibrated کانال نیست.</text><text x="440" y="682" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#174c73">Tx/Rx · temperature · alarm thresholds</text>
<rect x="515" y="535" width="410" height="190" rx="16" fill="#e3f6eb" stroke="#16845e" stroke-width="2"/><text x="895" y="575" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#155b42">OLTS</text><text x="895" y="610" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#155b42">اندازه‌گیری insertion loss end-to-end</text><text x="895" y="642" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#155b42">reference method، wavelength و leads را ثبت کن.</text><text x="895" y="682" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#155b42">Measured result با threshold پروژه مقایسه شود.</text>
<rect x="970" y="535" width="410" height="190" rx="16" fill="#fff3db" stroke="#d9ad49" stroke-width="2"/><text x="1350" y="575" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#76520d">OTDR</text><text x="1350" y="610" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#76520d">تحلیل طول و eventها از backscatter/reflection</text><text x="1350" y="642" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#76520d">Dead zone و pulse width روی تفسیر اثر دارند.</text><text x="1350" y="682" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#76520d">Launch/receive fibers طبق روش آزمون.</text>
<text x="720" y="778" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" font-weight="bold" fill="#9a2c2c">ایمنی: هرگز از داخل فیبر یا کانکتور نگاه نکن؛ از ابزار بازرسی و روش ایمن استفاده کن.</text></svg>