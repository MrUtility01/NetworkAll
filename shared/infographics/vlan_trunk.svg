<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">VLAN access and trunk</title><desc id="d">Hosts in different VLANs connect using untagged access ports and a tagged 802.1Q trunk; inter-VLAN routing requires a layer 3 gateway.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker></defs><rect width="1440" height="760" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0d3158"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">VLAN، Access Port و 802.1Q Trunk</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">عضویت VLAN، تگ فریم و مسیریابی بین VLANها سه مفهوم جدا هستند</text>
<rect x="78" y="198" width="250" height="108" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="203" y="235" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#14496f">PC-A</text><text x="203" y="270" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#14496f">VLAN 10</text><text x="203" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#14496f">Frame untagged at access</text>
<rect x="78" y="405" width="250" height="108" rx="16" fill="#f4e8ff" stroke="#8652ab" stroke-width="2"/><text x="203" y="442" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#593579">PC-B</text><text x="203" y="477" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#593579">VLAN 20</text><text x="203" y="499" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#593579">Frame untagged at access</text>
<rect x="465" y="250" width="250" height="220" rx="18" fill="#173c60" stroke="#0d3158" stroke-width="2"/><text x="590" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="24" font-weight="bold" fill="#fff">Switch A</text><rect x="495" y="318" width="190" height="50" rx="10" fill="#dcefff"/><text x="590" y="350" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#173c60">Access VLAN 10 / 20</text><rect x="495" y="382" width="190" height="50" rx="10" fill="#fff1ca"/><text x="590" y="414" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#70500b">Trunk 802.1Q</text>
<rect x="840" y="250" width="250" height="220" rx="18" fill="#173c60" stroke="#0d3158" stroke-width="2"/><text x="965" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="24" font-weight="bold" fill="#fff">Switch B</text><rect x="870" y="318" width="190" height="50" rx="10" fill="#dcefff"/><text x="965" y="350" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#173c60">VLAN 10, VLAN 20</text><rect x="870" y="382" width="190" height="50" rx="10" fill="#fff1ca"/><text x="965" y="414" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#70500b">Allowed VLAN list</text>
<rect x="1190" y="292" width="180" height="135" rx="16" fill="#e1f6e9" stroke="#16835d" stroke-width="2"/><text x="1280" y="330" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#15583f">L3 Gateway</text><text x="1280" y="364" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#15583f">SVI / Router</text><text x="1280" y="391" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#15583f">Routing + ACL</text>
<path d="M328 245 L465 310" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/><path d="M328 462 L465 405" stroke="#8652ab" stroke-width="4" marker-end="url(#a)"/><path d="M715 354 L840 354" stroke="#2477b7" stroke-width="5" marker-end="url(#a)"/><text x="778" y="333" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" font-weight="bold" fill="#165a8f">Tagged VLANs</text><path d="M1090 354 L1190 354" stroke="#16835d" stroke-width="4" marker-end="url(#a)"/>
<rect x="80" y="570" width="1280" height="110" rx="16" fill="#fff" stroke="#d1dfeb" stroke-width="2"/><text x="1328" y="608" text-anchor="end" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#163e62">نکته‌های پیاده‌سازی</text><text x="1328" y="640" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">Access: فریم سمت کلاینت معمولاً بی‌تگ؛ سوئیچ آن را به VLAN پورت نسبت می‌دهد.</text><text x="1328" y="666" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">Trunk: VLAN مجاز، native VLAN و دو سر لینک باید سازگار باشند؛ عبور VLAN به معنی inter-VLAN routing نیست.</text></svg>