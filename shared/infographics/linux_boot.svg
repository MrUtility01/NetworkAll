<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">مراحل بوت Linux</title><desc id="d">Firmware، bootloader، kernel و initramfs، root filesystem، systemd target و سرویس‌ها.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#557b9e"/></marker></defs><rect width="1200" height="680" rx="24" fill="#f4f8fd"/><text x="600" y="48" text-anchor="middle" font-size="30" font-family="Tahoma,Arial" font-weight="700" fill="#102f50">Linux Boot: Firmware تا systemd target</text><text x="600" y="80" text-anchor="middle" font-size="17" font-family="Tahoma,Arial" fill="#5b7087">مراحل مفهومی؛ bootloader، initramfs و init system در توزیع‌ها/دستگاه‌ها متفاوت‌اند.</text><g font-family="Tahoma,Arial"><rect x="25" y="145" width="170" height="190" rx="15" fill="#fff" stroke="#1677b9" stroke-width="2"/><rect x="25" y="145" width="170" height="48" rx="13" fill="#1677b9"/><rect x="25" y="180" width="170" height="13" fill="#1677b9"/><text x="110" y="175" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">1 · Firmware</text><text x="110" y="235" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">UEFI/BIOS</text><text x="110" y="271" text-anchor="middle" font-size="15" fill="#4c6680">POST و</text><text x="110" y="297" text-anchor="middle" font-size="14" fill="#4c6680">Boot entry</text></g><g font-family="Tahoma,Arial"><rect x="220" y="145" width="170" height="190" rx="15" fill="#fff" stroke="#7a55b7" stroke-width="2"/><rect x="220" y="145" width="170" height="48" rx="13" fill="#7a55b7"/><rect x="220" y="180" width="170" height="13" fill="#7a55b7"/><text x="305" y="175" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">2 · Bootloader</text><text x="305" y="235" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">GRUB / systemd-boot</text><text x="305" y="271" text-anchor="middle" font-size="15" fill="#4c6680">Kernel +</text><text x="305" y="297" text-anchor="middle" font-size="14" fill="#4c6680">initramfs</text></g><g font-family="Tahoma,Arial"><rect x="415" y="145" width="170" height="190" rx="15" fill="#fff" stroke="#0c8b82" stroke-width="2"/><rect x="415" y="145" width="170" height="48" rx="13" fill="#0c8b82"/><rect x="415" y="180" width="170" height="13" fill="#0c8b82"/><text x="500" y="175" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">3 · Kernel</text><text x="500" y="235" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">Drivers / Memory</text><text x="500" y="271" text-anchor="middle" font-size="15" fill="#4c6680">راه‌اندازی اولیه</text><text x="500" y="297" text-anchor="middle" font-size="14" fill="#4c6680"></text></g><g font-family="Tahoma,Arial"><rect x="610" y="145" width="170" height="190" rx="15" fill="#fff" stroke="#d27a1b" stroke-width="2"/><rect x="610" y="145" width="170" height="48" rx="13" fill="#d27a1b"/><rect x="610" y="180" width="170" height="13" fill="#d27a1b"/><text x="695" y="175" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">4 · initramfs</text><text x="695" y="235" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">Device discovery</text><text x="695" y="271" text-anchor="middle" font-size="15" fill="#4c6680">پیداکردن root</text><text x="695" y="297" text-anchor="middle" font-size="14" fill="#4c6680">FS</text></g><g font-family="Tahoma,Arial"><rect x="805" y="145" width="170" height="190" rx="15" fill="#fff" stroke="#176eaa" stroke-width="2"/><rect x="805" y="145" width="170" height="48" rx="13" fill="#176eaa"/><rect x="805" y="180" width="170" height="13" fill="#176eaa"/><text x="890" y="175" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">5 · PID 1</text><text x="890" y="235" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">systemd</text><text x="890" y="271" text-anchor="middle" font-size="15" fill="#4c6680">mount و</text><text x="890" y="297" text-anchor="middle" font-size="14" fill="#4c6680">dependency</text></g><g font-family="Tahoma,Arial"><rect x="1000" y="145" width="170" height="190" rx="15" fill="#fff" stroke="#16814f" stroke-width="2"/><rect x="1000" y="145" width="170" height="48" rx="13" fill="#16814f"/><rect x="1000" y="180" width="170" height="13" fill="#16814f"/><text x="1085" y="175" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">6 · Target</text><text x="1085" y="235" text-anchor="middle" font-size="18" fill="#153958" font-weight="700">Services / Login</text><text x="1085" y="271" text-anchor="middle" font-size="15" fill="#4c6680">multi-user یا</text><text x="1085" y="297" text-anchor="middle" font-size="14" fill="#4c6680">graphical</text></g><line x1="195" y1="242" x2="218" y2="242" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="390" y1="242" x2="413" y2="242" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="585" y1="242" x2="608" y2="242" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="780" y1="242" x2="803" y2="242" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><line x1="975" y1="242" x2="998" y2="242" stroke="#557b9e" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="382" width="1140" height="236" rx="18" fill="#fff" stroke="#d6e3ef"/><g font-family="Tahoma,Arial"><text x="600" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#153958">فرمان‌های مفید برای ثبت شواهد</text><text x="70" y="460" font-size="17" fill="#234867">• journalctl -b -1 : رخدادهای بوت قبلی، اگر در دسترس و persistent باشند.</text><text x="70" y="500" font-size="17" fill="#234867">• systemctl --failed : سرویس‌های fail شده؛ dependency و exit status را بررسی کنید.</text><text x="70" y="540" font-size="17" fill="#234867">• findmnt / و lsblk -f : تشخیص root filesystem، UUID و mountها.</text><text x="70" y="580" font-size="17" fill="#234867">• dmesg -T : خطاهای Kernel/driver؛ timestamp و تفاوت‌های ساعت را با احتیاط تفسیر کنید.</text><text x="600" y="647" text-anchor="middle" font-size="16" fill="#61768d">تغییر initramfs یا bootloader باید با نسخهٔ Kernel، root UUID و recovery media متناظر باشد.</text></g></svg>