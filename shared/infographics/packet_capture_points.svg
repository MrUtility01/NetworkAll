<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">Packet capture points</title><desc id="d">Capture points from endpoint to Wi-Fi access point, managed switch SPAN, firewall/router, WAN and server help localize where a packet disappears or changes.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker></defs><rect width="1440" height="760" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0d3158"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">Packet Capture — کجا capture بگیریم؟</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">مقایسهٔ شواهد در چند نقطه معمولاً از یک capture منفرد مفیدتر است</text>
<g font-family="Tahoma,sans-serif"><rect x="50" y="220" width="180" height="108" rx="15" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="140" y="261" text-anchor="middle" font-size="20" font-weight="bold" fill="#17496c">Endpoint</text><text x="140" y="293" text-anchor="middle" font-size="16" fill="#17496c">P1 · client capture</text>
<rect x="300" y="220" width="180" height="108" rx="15" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="390" y="261" text-anchor="middle" font-size="20" font-weight="bold" fill="#17496c">Wi‑Fi / AP</text><text x="390" y="293" text-anchor="middle" font-size="16" fill="#17496c">P2 · radio/LAN side</text>
<rect x="550" y="220" width="180" height="108" rx="15" fill="#fff3d9" stroke="#d6ab46" stroke-width="2"/><text x="640" y="261" text-anchor="middle" font-size="20" font-weight="bold" fill="#6e4f14">Switch SPAN</text><text x="640" y="293" text-anchor="middle" font-size="16" fill="#6e4f14">P3 · mirrored port</text>
<rect x="800" y="220" width="180" height="108" rx="15" fill="#e3f6eb" stroke="#16835d" stroke-width="2"/><text x="890" y="261" text-anchor="middle" font-size="20" font-weight="bold" fill="#15583f">Router / FW</text><text x="890" y="293" text-anchor="middle" font-size="16" fill="#15583f">P4 · ingress/egress</text>
<rect x="1050" y="220" width="160" height="108" rx="15" fill="#e3f6eb" stroke="#16835d" stroke-width="2"/><text x="1130" y="261" text-anchor="middle" font-size="20" font-weight="bold" fill="#15583f">WAN</text><text x="1130" y="293" text-anchor="middle" font-size="16" fill="#15583f">P5 · uplink</text>
<rect x="1270" y="220" width="130" height="108" rx="15" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="1335" y="261" text-anchor="middle" font-size="18" font-weight="bold" fill="#593579">Server</text><text x="1335" y="293" text-anchor="middle" font-size="15" fill="#593579">P6</text></g>
<path d="M230 274 L300 274 M480 274 L550 274 M730 274 L800 274 M980 274 L1050 274 M1210 274 L1270 274" stroke="#2477b7" stroke-width="5" marker-end="url(#a)"/>
<g font-family="Tahoma,sans-serif"><rect x="65" y="390" width="405" height="105" rx="15" fill="#fff" stroke="#d1dfeb" stroke-width="2"/><text x="445" y="429" text-anchor="end" font-size="19" font-weight="bold" fill="#163e62">اگر در P1 دیده نمی‌شود</text><text x="445" y="461" text-anchor="end" font-size="17" fill="#334f68">برنامه، stack سیستم‌عامل یا انتخاب interface را بررسی کن.</text><rect x="515" y="390" width="405" height="105" rx="15" fill="#fff" stroke="#d1dfeb" stroke-width="2"/><text x="895" y="429" text-anchor="end" font-size="19" font-weight="bold" fill="#163e62">در P1 هست، در P3 نیست</text><text x="895" y="461" text-anchor="end" font-size="17" fill="#334f68">Wi‑Fi/VLAN/پورت/مسیر SPAN یا drop محلی را بررسی کن.</text><rect x="965" y="390" width="405" height="105" rx="15" fill="#fff" stroke="#d1dfeb" stroke-width="2"/><text x="1345" y="429" text-anchor="end" font-size="19" font-weight="bold" fill="#163e62">در P4 خارج می‌شود، پاسخ برنمی‌گردد</text><text x="1345" y="461" text-anchor="end" font-size="17" fill="#334f68">مسیر برگشت، NAT، upstream و سرور را بررسی کن.</text></g>
<rect x="65" y="555" width="1305" height="112" rx="15" fill="#fff3d9" stroke="#e2bb58" stroke-width="2"/><text x="1338" y="592" text-anchor="end" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#704e12">احتیاط در تفسیر capture</text><text x="1338" y="625" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#704e12">SPAN ممکن است drop یا reorder کند؛ offload باعث تفاوت checksum/segment دیده‌شده شود؛ TLS محتوای رمز‌شده را پنهان می‌کند.</text><text x="1338" y="652" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#704e12">فیلتر، timestamp، interface، timezone، packet loss و جهت مشاهده را در گزارش ثبت کنید.</text></svg>