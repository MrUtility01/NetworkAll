<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">مقایسهٔ سوئیچ و روتر</title><desc id="d">مقایسهٔ تصمیم‌گیری بر اساس آدرس MAC و VLAN در سوئیچ با تصمیم‌گیری بر اساس IP و جدول مسیریابی در روتر.</desc>
<defs><linearGradient id="g1" x2="1" y2="1"><stop stop-color="#0b6bb8"/><stop offset="1" stop-color="#27a3d8"/></linearGradient><linearGradient id="g2" x2="1" y2="1"><stop stop-color="#137449"/><stop offset="1" stop-color="#28a77a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#607d99"/></marker></defs>
<rect width="1200" height="660" rx="24" fill="#f5f9fe"/><text x="600" y="52" text-anchor="middle" fill="#102c4d" font-family="Tahoma,Arial" font-size="30" font-weight="700">Switch و Router: دو نوع تصمیم متفاوت</text>
<rect x="28" y="86" width="554" height="400" rx="20" fill="#e9f5ff" stroke="#b8dcf7" stroke-width="2"/><rect x="618" y="86" width="554" height="400" rx="20" fill="#eaf8f0" stroke="#c4e8d2" stroke-width="2"/>
<rect x="28" y="86" width="554" height="62" rx="18" fill="url(#g1)"/><rect x="618" y="86" width="554" height="62" rx="18" fill="url(#g2)"/>
<text x="305" y="125" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#fff">L2 SWITCH</text><text x="895" y="125" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#fff">L3 ROUTER</text>
<g font-family="Tahoma,Arial" fill="#163957"><rect x="70" y="182" width="155" height="70" rx="12" fill="#fff" stroke="#8abfe7"/><text x="147" y="210" text-anchor="middle" font-size="18">Host A</text><text x="147" y="234" text-anchor="middle" font-size="14">MAC: AA</text><rect x="385" y="182" width="155" height="70" rx="12" fill="#fff" stroke="#8abfe7"/><text x="462" y="210" text-anchor="middle" font-size="18">Host B</text><text x="462" y="234" text-anchor="middle" font-size="14">MAC: BB</text><rect x="220" y="285" width="170" height="74" rx="12" fill="#d3eaff" stroke="#3292d3" stroke-width="2"/><text x="305" y="315" text-anchor="middle" font-size="18" font-weight="700">MAC / CAM Table</text><text x="305" y="340" text-anchor="middle" font-size="15">VLAN + Port</text><line x1="147" y1="252" x2="245" y2="285" stroke="#607d99" stroke-width="3" marker-end="url(#a)"/><line x1="462" y1="252" x2="362" y2="285" stroke="#607d99" stroke-width="3" marker-end="url(#a)"/><text x="305" y="397" text-anchor="middle" font-size="17">تصمیم با Destination MAC داخل VLAN</text><text x="305" y="429" text-anchor="middle" font-size="15">MAC ناشناخته: Flood محدود به همان VLAN</text><text x="305" y="457" text-anchor="middle" font-size="15">جدول از Source MAC یاد می‌گیرد</text>
<rect x="660" y="182" width="155" height="70" rx="12" fill="#fff" stroke="#9bd3b5"/><text x="737" y="210" text-anchor="middle" font-size="18">Subnet A</text><text x="737" y="234" text-anchor="middle" font-size="14">192.168.10.0/24</text><rect x="975" y="182" width="155" height="70" rx="12" fill="#fff" stroke="#9bd3b5"/><text x="1052" y="210" text-anchor="middle" font-size="18">Subnet B</text><text x="1052" y="234" text-anchor="middle" font-size="14">192.168.20.0/24</text><rect x="810" y="285" width="170" height="74" rx="12" fill="#d4f2e1" stroke="#1a9460" stroke-width="2"/><text x="895" y="315" text-anchor="middle" font-size="18" font-weight="700">Routing Table</text><text x="895" y="340" text-anchor="middle" font-size="15">Prefix → Next Hop</text><line x1="737" y1="252" x2="835" y2="285" stroke="#607d99" stroke-width="3" marker-end="url(#a)"/><line x1="1052" y1="252" x2="952" y2="285" stroke="#607d99" stroke-width="3" marker-end="url(#a)"/><text x="895" y="397" text-anchor="middle" font-size="17">تصمیم با Destination IP و Longest Prefix</text><text x="895" y="429" text-anchor="middle" font-size="15">مرز Broadcast Domain در حالت Route</text><text x="895" y="457" text-anchor="middle" font-size="15">TTL/Hop Limit کم می‌شود</text></g>
<rect x="28" y="512" width="1144" height="115" rx="16" fill="#fff" stroke="#d7e3ef"/><text x="600" y="548" text-anchor="middle" font-family="Tahoma,Arial" font-size="20" font-weight="700" fill="#173e65">چک‌لیست عیب‌یابی</text><text x="600" y="582" text-anchor="middle" font-family="Tahoma,Arial" font-size="17" fill="#365675">Switch: VLAN / MAC table / trunk / STP / port errors</text><text x="600" y="610" text-anchor="middle" font-family="Tahoma,Arial" font-size="17" fill="#365675">Router: IP / mask / route table / ARP-ND / ACL / NAT / TTL</text></svg>