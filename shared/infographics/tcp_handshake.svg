<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">TCP connection sequence</title><desc id="d">TCP three way handshake and simplified graceful termination between client and server.</desc>
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176da8"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16835d"/></marker></defs><rect width="1440" height="760" rx="28" fill="#f1f6fb"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0e2d50"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">TCP — برقراری اتصال، انتقال داده و پایان</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">سه‌مرحله‌ای بودن handshake با انتقال داده یا تضمین سلامت برنامه یکی نیست</text>
<rect x="180" y="150" width="300" height="74" rx="14" fill="#dff0ff" stroke="#277ab4" stroke-width="2"/><text x="330" y="195" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#17496c">Client</text><rect x="960" y="150" width="300" height="74" rx="14" fill="#e0f6ec" stroke="#16835d" stroke-width="2"/><text x="1110" y="195" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#14563f">Server</text><path d="M330 230 V665 M1110 230 V665" stroke="#9bb0c4" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M350 280 L1090 280" stroke="#176da8" stroke-width="4" marker-end="url(#b)"/><text x="720" y="262" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#155b89">SYN · seq = x</text><text x="720" y="310" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">کلاینت آغاز اتصال و شمارهٔ توالی اولیه را اعلام می‌کند.</text>
<path d="M1090 365 L350 365" stroke="#16835d" stroke-width="4" marker-end="url(#r)"/><text x="720" y="347" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#14684b">SYN + ACK · seq = y, ack = x+1</text><text x="720" y="396" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">سرور SYN را تأیید و توالی خودش را اعلام می‌کند.</text>
<path d="M350 448 L1090 448" stroke="#176da8" stroke-width="4" marker-end="url(#b)"/><text x="720" y="430" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#155b89">ACK · ack = y+1</text><text x="720" y="478" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">اتصال TCP آمادهٔ تبادل داده است؛ برنامه هنوز باید موفق شود.</text>
<rect x="520" y="500" width="400" height="50" rx="12" fill="#fff5d9" stroke="#d5ab43"/><text x="720" y="532" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#76520d">Data · sequence / ACK · window</text>
<path d="M350 580 L1090 580" stroke="#176da8" stroke-width="3" marker-end="url(#b)"/><text x="720" y="572" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#155b89">FIN → ACK → FIN → ACK (مدل سادهٔ پایان دوطرفه)</text>
<rect x="105" y="620" width="1230" height="78" rx="14" fill="#e7edf4"/><text x="720" y="652" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" font-weight="bold" fill="#243d56">برای عیب‌یابی: SYN دیده می‌شود؟ SYN-ACK برمی‌گردد؟ ACK نهایی رد می‌شود؟</text><text x="720" y="680" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">RST، timeout، retransmission، MTU، stateful firewall و TLS را از هم تفکیک کنید.</text></svg>