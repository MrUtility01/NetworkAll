<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="t d">
<title id="t">802.1X and RADIUS NAC authentication decision</title><desc id="d">Supplicant exchanges EAPOL with an Authenticator, which relays AAA requests to a RADIUS server; policy enforcement then assigns a limited network role/VLAN and accounting records the session.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2776b7"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16845e"/></marker></defs><rect width="1440" height="820" rx="28" fill="#f3f7fb"/><rect x="32" y="28" width="1376" height="92" rx="18" fill="#12365a"/><text x="1368" y="65" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">802.1X / RADIUS / NAC — از هویت تا نقش شبکه</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d9eaff">Authentication موفق، Authorization و enforcement موفق را خودکار تضمین نمی‌کند.</text>
<rect x="65" y="180" width="280" height="135" rx="18" fill="#e0f1ff" stroke="#2776b7" stroke-width="2"/><text x="205" y="222" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#174c73">Supplicant</text><text x="205" y="256" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#174c73">PC / phone / endpoint</text><text x="205" y="284" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#174c73">EAP method + identity proof</text>
<rect x="435" y="180" width="280" height="135" rx="18" fill="#fff3db" stroke="#d9ad49" stroke-width="2"/><text x="575" y="222" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#76520d">Authenticator</text><text x="575" y="256" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#76520d">Switch / Access Point</text><text x="575" y="284" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#76520d">Controlled port · EAPOL</text>
<rect x="805" y="180" width="280" height="135" rx="18" fill="#e2f6ec" stroke="#16845e" stroke-width="2"/><text x="945" y="222" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#155b42">RADIUS / AAA</text><text x="945" y="256" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#155b42">Identity / certificate policy</text><text x="945" y="284" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#155b42">Accept / Reject / Challenge</text>
<rect x="1170" y="180" width="205" height="135" rx="18" fill="#e9e4ff" stroke="#8065b2" stroke-width="2"/><text x="1272" y="222" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#4f3a83">Policy</text><text x="1272" y="256" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#4f3a83">Role / VLAN / ACL</text><text x="1272" y="284" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#4f3a83">Least privilege</text>
<path d="M345 230 L435 230" stroke="#2776b7" stroke-width="4" marker-end="url(#a)"/><text x="390" y="210" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#174c73">EAPOL</text><path d="M715 230 L805 230" stroke="#2776b7" stroke-width="4" marker-end="url(#a)"/><text x="760" y="210" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#174c73">RADIUS</text><path d="M1085 230 L1170 230" stroke="#16845e" stroke-width="4" marker-end="url(#g)"/>
<rect x="65" y="370" width="630" height="170" rx="18" fill="#fff" stroke="#c9d9e8" stroke-width="2"/><text x="665" y="410" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#173f62">حالت موفق</text><text x="665" y="450" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#294d6c">Identity validated → policy selected → port/role actually applied.</text><text x="665" y="482" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#294d6c">پس از Accept، VLAN، DHCP، route و access to required service را test کن.</text><text x="665" y="514" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#61788b">Accounting: start / interim / stop, session ID, NAS and timestamps.</text>
<rect x="745" y="370" width="630" height="170" rx="18" fill="#ffeded" stroke="#c74c4c" stroke-width="2"/><text x="1345" y="410" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#8e2b2b">حالت شکست</text><text x="1345" y="450" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#8e2b2b">No response ≠ Reject; Accept ≠ reachable application.</text><text x="1345" y="482" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#8e2b2b">Supplicant/EAP → RADIUS transport → identity/policy → enforcement</text><text x="1345" y="514" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#8e2b2b">Fallback/MAB را به role محدود و policy صریح متصل کن.</text>
<rect x="65" y="585" width="1310" height="145" rx="18" fill="#fff" stroke="#c9d9e8" stroke-width="2"/><text x="1345" y="625" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#173f62">کنترل‌های معماری</text><text x="1345" y="663" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#294d6c">EAP-TLS certificate lifecycle · RADIUS/TLS compatibility · TACACS+ device admin · fail-open/closed · privacy-aware accounting</text><text x="1345" y="697" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#61788b">مرجع‌ها: IEEE 802.1X-2020، RFC 3748، RFC 9765 (Experimental)، RFC 9887 (TACACS+ over TLS 1.3).</text>
<text x="720" y="782" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#9a2c2c">Acceptance: یک تست مثبت، یک تست منفی و شاهد واقعی از policy و data-plane.</text></svg>