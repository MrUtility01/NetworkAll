<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Enterprise Wi-Fi site survey and troubleshooting</title>
<desc id="desc">A conceptual enterprise WLAN diagram showing multiple access points, channel overlap, a roaming client, measurement points for RSSI/SNR and application KPIs, and an authentication path through RADIUS.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker><marker id="gr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16835d"/></marker></defs>
<rect width="1400" height="820" rx="26" fill="#f2f7fc"/><rect x="28" y="24" width="1344" height="88" rx="18" fill="#0d3158"/><text x="1335" y="62" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">Enterprise WLAN — Site Survey و عیب‌یابی</text><text x="1335" y="91" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#d6eaff">Coverage، capacity، roaming و authentication چهار مسئلهٔ مرتبط ولی مستقل‌اند.</text>
<rect x="55" y="150" width="875" height="475" rx="20" fill="#fff" stroke="#cbddea" stroke-width="2"/>
<path d="M90 205 L890 205 M90 305 L890 305 M90 405 L890 405 M90 505 L890 505" stroke="#e1eaf2" stroke-width="2" stroke-dasharray="6 8"/>
<path d="M115 185 C105 90 390 95 405 185 C420 290 180 315 115 185 Z" fill="#d6eaff" opacity=".8"/><path d="M415 185 C400 95 705 95 715 185 C728 292 475 315 415 185 Z" fill="#d7f5e5" opacity=".8"/><path d="M690 185 C680 105 910 110 910 205 C910 305 735 305 690 185 Z" fill="#f9e7c5" opacity=".8"/>
<g font-family="Tahoma,sans-serif"><rect x="155" y="185" width="180" height="65" rx="13" fill="#dcefff" stroke="#2477b7" stroke-width="2"/><text x="245" y="211" text-anchor="middle" font-size="20" font-weight="bold" fill="#17496c">AP-1</text><text x="245" y="235" text-anchor="middle" font-size="15" fill="#17496c">Ch. 36 · 5 GHz</text>
<rect x="455" y="185" width="180" height="65" rx="13" fill="#e0f6e9" stroke="#16835d" stroke-width="2"/><text x="545" y="211" text-anchor="middle" font-size="20" font-weight="bold" fill="#15583f">AP-2</text><text x="545" y="235" text-anchor="middle" font-size="15" fill="#15583f">Ch. 44 · 5 GHz</text>
<rect x="725" y="185" width="180" height="65" rx="13" fill="#fff4dd" stroke="#d6ab46" stroke-width="2"/><text x="815" y="211" text-anchor="middle" font-size="20" font-weight="bold" fill="#6e4f14">AP-3</text><text x="815" y="235" text-anchor="middle" font-size="15" fill="#6e4f14">Band/channel per survey</text>
<rect x="130" y="360" width="220" height="84" rx="14" fill="#fff" stroke="#98b5cc" stroke-width="2"/><text x="240" y="391" text-anchor="middle" font-size="18" font-weight="bold" fill="#244967">Survey point A</text><text x="240" y="420" text-anchor="middle" font-size="15" fill="#405a73">RSSI · SNR · retries</text>
<rect x="420" y="395" width="220" height="84" rx="14" fill="#fff" stroke="#98b5cc" stroke-width="2"/><text x="530" y="426" text-anchor="middle" font-size="18" font-weight="bold" fill="#244967">Roaming corridor</text><text x="530" y="455" text-anchor="middle" font-size="15" fill="#405a73">Loss · interruption time</text>
<rect x="690" y="360" width="205" height="84" rx="14" fill="#fff" stroke="#98b5cc" stroke-width="2"/><text x="792" y="391" text-anchor="middle" font-size="18" font-weight="bold" fill="#244967">Survey point B</text><text x="792" y="420" text-anchor="middle" font-size="15" fill="#405a73">Latency · throughput</text>
<path d="M240 250 L240 360 M545 250 L545 395 M815 250 L815 360" stroke="#2477b7" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr)"/>
<path d="M350 402 C380 350 405 390 420 430" fill="none" stroke="#16835d" stroke-width="4" marker-end="url(#gr)"/><path d="M640 437 C660 460 672 415 690 400" fill="none" stroke="#16835d" stroke-width="4" marker-end="url(#gr)"/>
<text x="500" y="560" text-anchor="middle" font-size="19" font-weight="bold" fill="#163e62">Radio metrics ≠ Application quality</text><text x="500" y="590" text-anchor="middle" font-size="16" fill="#405a73">Co-channel contention · backhaul · client radio · retries · airtime</text></g>
<rect x="965" y="150" width="380" height="220" rx="18" fill="#fff" stroke="#cbddea" stroke-width="2"/><text x="1315" y="188" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#163e62">Authentication path</text>
<rect x="1000" y="220" width="135" height="55" rx="11" fill="#e0f1ff" stroke="#2477b7"/><text x="1067" y="254" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">Client</text><rect x="1170" y="220" width="135" height="55" rx="11" fill="#e0f6e9" stroke="#16835d"/><text x="1237" y="254" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#15583f">AP / Controller</text><path d="M1135 248 L1170 248" stroke="#2477b7" stroke-width="3" marker-end="url(#arr)"/>
<rect x="1080" y="300" width="170" height="48" rx="10" fill="#fff4dd" stroke="#d6ab46"/><text x="1165" y="330" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#6e4f14">RADIUS / EAP</text><path d="M1237 275 L1237 287 L1165 287 L1165 300" stroke="#2477b7" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="965" y="395" width="380" height="230" rx="18" fill="#fff4dd" stroke="#d6ab46" stroke-width="2"/><text x="1315" y="433" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#6e4f14">چه چیزهایی را ثبت کنیم؟</text><text x="1315" y="470" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#765411">• Client model/driver/firmware</text><text x="1315" y="500" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#765411">• Band/channel/width/power</text><text x="1315" y="530" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#765411">• RSSI/SNR/retries/airtime</text><text x="1315" y="560" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#765411">• RADIUS, DHCP, DNS and VLAN mapping</text><text x="1315" y="590" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#765411">• Throughput, latency, jitter, loss, roam time</text>
<text x="700" y="710" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">Regulatory domain و power/channel limits را در محل نصب بررسی کنید؛ این شکل، plan نمونه است نه کانال‌بندی اجرایی.</text><text x="700" y="750" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">Passive survey برای RF همسایه؛ active survey برای تجربهٔ واقعی client و application است.</text></svg>