<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="t d">
<title id="t">PKI certificate chain and TLS identity validation</title><desc id="d">A certificate chain from trust anchor root CA to intermediate CA to leaf server certificate, with separate checks for path validation and service hostname verification.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2776b7"/></marker></defs><rect width="1440" height="820" rx="28" fill="#f3f7fb"/><rect x="32" y="28" width="1376" height="92" rx="18" fill="#12365a"/><text x="1368" y="65" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">PKI و TLS — گواهی معتبر، نام درست و کلید امن</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d9eaff">اعتبار زنجیره و تطبیق hostname دو بررسی جدا هستند.</text>
<rect x="75" y="185" width="360" height="130" rx="18" fill="#e0f1ff" stroke="#2776b7" stroke-width="2"/><text x="255" y="228" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#174c73">Root CA</text><text x="255" y="262" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#174c73">Trust anchor in client store</text><text x="255" y="288" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#174c73">Root trust is explicit local policy</text>
<rect x="540" y="185" width="360" height="130" rx="18" fill="#e2f6ec" stroke="#16845e" stroke-width="2"/><text x="720" y="228" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#155b42">Intermediate CA</text><text x="720" y="262" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#155b42">Issuance constraints / key custody</text><text x="720" y="288" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#155b42">Purpose-specific trust domain</text>
<rect x="1005" y="185" width="360" height="130" rx="18" fill="#fff3db" stroke="#d9ad49" stroke-width="2"/><text x="1185" y="228" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#76520d">Leaf / Server cert</text><text x="1185" y="262" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#76520d">Public key · SAN · EKU · validity</text><text x="1185" y="288" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#76520d">Private key stays protected on service</text>
<path d="M435 250 L540 250 M900 250 L1005 250" stroke="#2776b7" stroke-width="4" marker-end="url(#a)"/>
<rect x="75" y="365" width="620" height="180" rx="18" fill="#fff" stroke="#c9d9e8" stroke-width="2"/><text x="665" y="405" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#173f62">۱. Path validation</text><text x="665" y="445" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#294d6c">Signatures · validity · Basic Constraints · Key Usage/EKU</text><text x="665" y="477" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#294d6c">Trust anchor · policy · revocation according to client policy</text><text x="665" y="515" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#61788b">A chain can build but still fail validation.</text>
<rect x="745" y="365" width="620" height="180" rx="18" fill="#fff" stroke="#c9d9e8" stroke-width="2"/><text x="1335" y="405" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#173f62">۲. Service identity validation</text><text x="1335" y="445" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#294d6c">Requested hostname / IP must match supported SAN identity.</text><text x="1335" y="477" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#294d6c">SNI helps select service; it does not replace name checking.</text><text x="1335" y="515" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#61788b">A trusted certificate for the wrong name must be rejected.</text>
<rect x="75" y="590" width="1290" height="140" rx="18" fill="#e9e4ff" stroke="#8065b2" stroke-width="2"/><text x="1335" y="630" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#4f3a83">چرخهٔ عمر گواهی</text><text x="1335" y="665" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#4f3a83">Generate key/CSR → prove identity → issue certificate → deploy chain → monitor expiry → renew/revoke → verify every endpoint.</text><text x="1335" y="699" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#4f3a83">مراجع جاری: RFC 9846 (TLS 1.3)، RFC 5280 (X.509 path)، RFC 9525 (service identity).</text>
<text x="720" y="782" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#9a2c2c">کلید خصوصی، secret و token را در مخزن عمومی یا گزارش‌های آموزشی ذخیره نکن.</text></svg>