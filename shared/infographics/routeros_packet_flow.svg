<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">RouterOS packet path: input, forward, output and connection tracking</title>
<desc id="desc">A conceptual IPv4 packet path with raw, connection tracking, NAT, route lookup, filter chain selection, postrouting and egress. Exact processing order depends on RouterOS version and packet direction.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16835d"/></marker></defs>
<rect width="1400" height="820" rx="26" fill="#f2f7fc"/><rect x="28" y="24" width="1344" height="88" rx="18" fill="#0d3158"/><text x="1335" y="62" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">RouterOS — مسیر مفهومی پردازش Packet</text><text x="1335" y="91" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#d6eaff">ترتیب دقیق hookها تابع نسخه، IPv4/IPv6 و جهت جریان است؛ این نمودار جایگزین packet-flow رسمی release نیست.</text>
<rect x="50" y="175" width="190" height="92" rx="14" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="145" y="213" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#17496c">Ingress</text><text x="145" y="242" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">Interface / VLAN</text>
<rect x="290" y="165" width="220" height="112" rx="14" fill="#fff4dd" stroke="#d6ab46" stroke-width="2"/><text x="400" y="205" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#6e4f14">RAW / Notrack</text><text x="400" y="235" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#6e4f14">Optional early policy</text><text x="400" y="257" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#876924">Do not bypass needed state</text>
<rect x="565" y="165" width="230" height="112" rx="14" fill="#e1f6e9" stroke="#16835d" stroke-width="2"/><text x="680" y="205" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#15583f">Conntrack</text><text x="680" y="235" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#15583f">New / Established</text><text x="680" y="257" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#15583f">Flow state / NAT state</text>
<path d="M240 220 L290 220 M510 220 L565 220" stroke="#2477b7" stroke-width="4" marker-end="url(#arr)"/>
<path d="M795 220 L850 220" stroke="#2477b7" stroke-width="4" marker-end="url(#arr)"/>
<path d="M900 157 L995 220 L900 283 L805 220 Z" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="900" y="215" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="19" font-weight="bold" fill="#593579">NAT /</text><text x="900" y="239" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="19" font-weight="bold" fill="#593579">Route lookup</text>
<rect x="1040" y="165" width="300" height="112" rx="14" fill="#fff" stroke="#aac0d3" stroke-width="2"/><text x="1190" y="203" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#203f5b">Filter decision</text><text x="1190" y="232" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#2f536f">input / forward / output</text><text x="1190" y="257" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#60788f">Chain depends on packet destination</text><path d="M995 220 L1040 220" stroke="#2477b7" stroke-width="4" marker-end="url(#arr)"/>
<rect x="80" y="350" width="590" height="148" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="640" y="388" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#17496c">INPUT — مقصد خود روتر</text><text x="640" y="423" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" fill="#17496c">WinBox / SSH / API / DNS روی روتر</text><text x="640" y="455" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">بررسی access source، service، state و policy مدیریت</text><text x="640" y="480" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#52708a">اجازه در input، به معنی اجازهٔ عبور کلاینت‌ها نیست.</text>
<rect x="730" y="350" width="590" height="148" rx="16" fill="#e1f6e9" stroke="#16835d" stroke-width="2"/><text x="1290" y="388" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#15583f">FORWARD — ترافیک عبوری</text><text x="1290" y="423" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" fill="#15583f">LAN → WAN / VLAN → VLAN / VPN → LAN</text><text x="1290" y="455" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#15583f">Filter، route برگشت، NAT state و next-hop</text><text x="1290" y="480" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#517865">NAT به تنهایی مجوز عبور ایجاد نمی‌کند.</text>
<rect x="80" y="535" width="590" height="118" rx="16" fill="#fff4dd" stroke="#d6ab46" stroke-width="2"/><text x="640" y="574" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#6e4f14">OUTPUT — ترافیک تولیدی روتر</text><text x="640" y="607" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#6e4f14">DNS query / NTP / connection آغازشده از خود روتر</text><text x="640" y="632" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#876924">Ping خود روتر، forward client را ثابت نمی‌کند.</text>
<rect x="730" y="535" width="590" height="118" rx="16" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="1290" y="574" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#593579">Egress / Postrouting</text><text x="1290" y="607" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#593579">Source NAT، انتخاب رابط و انتقال به لینک بعدی</text><text x="1290" y="632" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#74588e">Capture دو سوی NAT باید tuple متفاوت را لحاظ کند.</text>
<path d="M1190 277 L1190 320 L375 320 L375 350" stroke="#2477b7" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1190 320 L1025 320 L1025 350" stroke="#16835d" stroke-width="3" fill="none" marker-end="url(#green)"/><path d="M375 498 L375 535" stroke="#2477b7" stroke-width="3" marker-end="url(#arr)"/><path d="M1025 498 L1025 535" stroke="#16835d" stroke-width="3" marker-end="url(#green)"/>
<rect x="50" y="690" width="1290" height="82" rx="14" fill="#fff" stroke="#cfdeea" stroke-width="2"/><text x="1310" y="722" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" font-weight="bold" fill="#173d5b">روش عیب‌یابی</text><text x="1310" y="750" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#36556e">Flow tuple + selected table + connection/NAT state + filter counters + capture دوطرفه + آزمون کاربردی را هم‌زمان ثبت کن.</text></svg>