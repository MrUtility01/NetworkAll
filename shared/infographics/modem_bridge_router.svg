<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="t d">
<title id="t">Modem, ONT, bridge and router modes</title><desc id="d">Compare bridge mode where the customer router owns WAN connectivity, router mode where the ISP CPE owns routing and NAT, and integrated ONT/router devices.</desc>
<rect width="1440" height="800" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0d3158"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">مودم / ONT / Router — Bridge در برابر Router Mode</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">نقش منطقی دستگاه را از شکل ظاهری آن استنتاج نکن؛ وضعیت WAN/LAN و NAT را بررسی کن</text>
<rect x="55" y="160" width="420" height="470" rx="18" fill="#fff" stroke="#c9dbea" stroke-width="2"/><text x="445" y="202" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#17496c">A · Bridge Mode</text><rect x="90" y="240" width="350" height="74" rx="13" fill="#dcefff" stroke="#2477b7" stroke-width="2"/><text x="265" y="285" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#17496c">ISP access / modem / ONT</text><path d="M265 314 V355" stroke="#2477b7" stroke-width="4"/><rect x="90" y="355" width="350" height="74" rx="13" fill="#e0f6e9" stroke="#16835d" stroke-width="2"/><text x="265" y="400" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#15583f">Your Router owns WAN</text><path d="M265 429 V470" stroke="#2477b7" stroke-width="4"/><rect x="90" y="470" width="350" height="74" rx="13" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="265" y="515" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#593579">LAN / Wi‑Fi / DHCP</text><text x="265" y="582" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#536d85">PPPoE / public IP غالباً روی روتر شما</text>
<rect x="510" y="160" width="420" height="470" rx="18" fill="#fff" stroke="#c9dbea" stroke-width="2"/><text x="900" y="202" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#17496c">B · Router Mode</text><rect x="545" y="240" width="350" height="74" rx="13" fill="#dcefff" stroke="#2477b7" stroke-width="2"/><text x="720" y="285" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#17496c">ISP access</text><path d="M720 314 V355" stroke="#2477b7" stroke-width="4"/><rect x="545" y="355" width="350" height="74" rx="13" fill="#e0f6e9" stroke="#16835d" stroke-width="2"/><text x="720" y="400" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#15583f">CPE Router + NAT + Firewall</text><path d="M720 429 V470" stroke="#2477b7" stroke-width="4"/><rect x="545" y="470" width="350" height="74" rx="13" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="720" y="515" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#593579">Private LAN / DHCP / Wi‑Fi</text><text x="720" y="582" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#536d85">WAN auth, route و translation روی CPE</text>
<rect x="965" y="160" width="420" height="470" rx="18" fill="#fff" stroke="#c9dbea" stroke-width="2"/><text x="1355" y="202" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#17496c">C · Double NAT</text><rect x="1000" y="240" width="350" height="74" rx="13" fill="#dcefff" stroke="#2477b7" stroke-width="2"/><text x="1175" y="285" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#17496c">ISP CPE: NAT #1</text><path d="M1175 314 V355" stroke="#2477b7" stroke-width="4"/><rect x="1000" y="355" width="350" height="74" rx="13" fill="#fff3d9" stroke="#d6ab46" stroke-width="2"/><text x="1175" y="400" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#6e4f14">Own Router: NAT #2</text><path d="M1175 429 V470" stroke="#2477b7" stroke-width="4"/><rect x="1000" y="470" width="350" height="74" rx="13" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="1175" y="515" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" fill="#593579">Private LAN</text><text x="1175" y="582" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#536d85">ممکن است inbound/VPN و forwarding پیچیده‌تر شود</text>
<rect x="60" y="665" width="1320" height="95" rx="16" fill="#fff3d9" stroke="#e2bb58" stroke-width="2"/><text x="1345" y="702" text-anchor="end" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#704e12">برای تشخیص حالت</text><text x="1345" y="735" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#704e12">بررسی کن: WAN IP، default route، DHCP server، NAT/conntrack، PPPoE و bridge/VLAN؛ ONT فیبر را خاتمه می‌دهد، اما ممکن است روتر هم در همان بدنه باشد.</text></svg>