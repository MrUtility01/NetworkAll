<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="t d">
<title id="t">مسیر اتصال Wi-Fi سازمانی</title><desc id="d">کلاینت ابتدا اتصال رادیویی و احراز هویت دارد، سپس AP ترافیک را به VLAN سوییچ می‌فرستد و از DHCP/DNS، gateway و firewall به مقصد می‌رسد.</desc>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#3f739d"/></marker></defs><rect width="1300" height="720" rx="24" fill="#f5f9fe"/><text x="650" y="48" text-anchor="middle" font-family="Tahoma,Arial" font-size="30" font-weight="700" fill="#103253">Wi‑Fi سازمانی: Association تا اینترنت</text><text x="650" y="82" text-anchor="middle" font-family="Tahoma,Arial" font-size="17" fill="#5c7288">موفقیت هر مرحله شرط مرحلهٔ بعد نیست؛ هر لایه را جدا اندازه‌گیری کنید.</text>
<g font-family="Tahoma,Arial"><rect x="36" y="150" width="190" height="110" rx="15" fill="#e4f2ff" stroke="#9ac9ef"/><text x="131" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#12558c">Client</text><text x="131" y="219" text-anchor="middle" font-size="15" fill="#345a77">Scan / Authenticate</text><text x="131" y="242" text-anchor="middle" font-size="15" fill="#345a77">Associate / Keys</text>
<rect x="264" y="150" width="190" height="110" rx="15" fill="#f0ebff" stroke="#d2c5f4"/><text x="359" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#6545a7">Access Point</text><text x="359" y="219" text-anchor="middle" font-size="15" fill="#345a77">SSID ↔ VLAN</text><text x="359" y="242" text-anchor="middle" font-size="15" fill="#345a77">RF / Roaming</text>
<rect x="492" y="150" width="190" height="110" rx="15" fill="#e8f8ee" stroke="#a9dfbf"/><text x="587" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#176c43">Switch</text><text x="587" y="219" text-anchor="middle" font-size="15" fill="#345a77">Access / Trunk</text><text x="587" y="242" text-anchor="middle" font-size="15" fill="#345a77">MAC / STP</text>
<rect x="720" y="150" width="190" height="110" rx="15" fill="#fff3e6" stroke="#f0d0ab"/><text x="815" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#9e5715">DHCP / DNS</text><text x="815" y="219" text-anchor="middle" font-size="15" fill="#345a77">IP / Gateway</text><text x="815" y="242" text-anchor="middle" font-size="15" fill="#345a77">Name Resolution</text>
<rect x="948" y="150" width="150" height="110" rx="15" fill="#ffe9e6" stroke="#f4bcb3"/><text x="1023" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#a84333">Gateway</text><text x="1023" y="219" text-anchor="middle" font-size="15" fill="#345a77">Route / ACL</text><text x="1023" y="242" text-anchor="middle" font-size="15" fill="#345a77">NAT / Firewall</text>
<rect x="1136" y="150" width="130" height="110" rx="15" fill="#e1f5f8" stroke="#a3dce2"/><text x="1201" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#126d7b">WAN</text><text x="1201" y="219" text-anchor="middle" font-size="14" fill="#345a77">ISP / Internet</text>
<line x1="226" y1="205" x2="258" y2="205" stroke="#3f739d" stroke-width="3" marker-end="url(#m)"/><line x1="454" y1="205" x2="486" y2="205" stroke="#3f739d" stroke-width="3" marker-end="url(#m)"/><line x1="682" y1="205" x2="714" y2="205" stroke="#3f739d" stroke-width="3" marker-end="url(#m)"/><line x1="910" y1="205" x2="942" y2="205" stroke="#3f739d" stroke-width="3" marker-end="url(#m)"/><line x1="1098" y1="205" x2="1130" y2="205" stroke="#3f739d" stroke-width="3" marker-end="url(#m)"/>
<rect x="36" y="315" width="590" height="315" rx="18" fill="#fff" stroke="#d5e2ef"/><text x="331" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#153958">عیب‌یابی لایه‌به‌لایه</text><text x="75" y="395" font-size="18" fill="#234867">۱. Radio / RSSI / Channel / Interference</text><text x="75" y="438" font-size="18" fill="#234867">۲. Authentication / Association / Security</text><text x="75" y="481" font-size="18" fill="#234867">۳. AP mapping و VLAN / trunk</text><text x="75" y="524" font-size="18" fill="#234867">۴. DHCP lease و default gateway</text><text x="75" y="567" font-size="18" fill="#234867">۵. DNS → Route / ACL / NAT → مقصد</text><text x="331" y="606" text-anchor="middle" font-size="15" fill="#65788c">Ping موفق فقط بخشی از مسیر را ثابت می‌کند.</text>
<rect x="654" y="315" width="612" height="315" rx="18" fill="#edf7ff" stroke="#b9d9f3"/><text x="960" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#13598e">شواهدی که باید ثبت شود</text><text x="694" y="395" font-size="18" fill="#234867">• کلاینت: IP، BSSID، RSSI، route، DNS resolver</text><text x="694" y="438" font-size="18" fill="#234867">• AP/Controller: event، auth reason، roaming، RF</text><text x="694" y="481" font-size="18" fill="#234867">• Switch: VLAN، trunk allowed list، STP، errors</text><text x="694" y="524" font-size="18" fill="#234867">• DHCP/DNS: lease، optionها، response/TTL</text><text x="694" y="567" font-size="18" fill="#234867">• Gateway: route، ACL/firewall counter، NAT state</text><text x="960" y="606" text-anchor="middle" font-size="15" fill="#65788c">نمودار ساده‌سازی شده است؛ معماری controller-based متفاوت می‌شود.</text></g></svg>