<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">NAT and PAT translation</title><desc id="d">Private hosts share a public address through port address translation, with a connection table tracking inside addresses and ports.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17845f"/></marker></defs><rect width="1440" height="760" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0d3158"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">NAT / PAT — ترجمهٔ آدرس و پورت</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">PAT چند جریان را با public IP مشترک و پورت‌های متمایز نگه می‌دارد</text>
<rect x="60" y="185" width="300" height="355" rx="18" fill="#fff" stroke="#cadbea" stroke-width="2"/><text x="330" y="225" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#183f62">Inside / Private LAN</text><rect x="92" y="255" width="236" height="90" rx="13" fill="#e0f1ff" stroke="#2477b7"/><text x="210" y="290" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#174b70">Host A</text><text x="210" y="320" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#174b70">192.168.1.10:51500</text><rect x="92" y="375" width="236" height="90" rx="13" fill="#f4e8ff" stroke="#8652ab"/><text x="210" y="410" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#593579">Host B</text><text x="210" y="440" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#593579">192.168.1.11:51500</text>
<rect x="500" y="200" width="420" height="320" rx="18" fill="#173c60"/><text x="710" y="243" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="24" font-weight="bold" fill="#fff">Router / NAT state</text><text x="710" y="278" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#d6eaff">WAN public: 203.0.113.9</text><rect x="536" y="308" width="348" height="160" rx="12" fill="#fff"/><text x="862" y="340" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" font-weight="bold" fill="#173c60">ترجمهٔ جریان‌ها</text><text x="862" y="372" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#334f68">192.168.1.10:51500 → 203.0.113.9:40001</text><text x="862" y="404" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#334f68">192.168.1.11:51500 → 203.0.113.9:40002</text><text x="862" y="441" text-anchor="end" font-family="Tahoma,sans-serif" font-size="14" fill="#62778b">Remote endpoint + protocol نیز در state اهمیت دارند.</text>
<rect x="1070" y="275" width="300" height="170" rx="18" fill="#e2f7ea" stroke="#17845f" stroke-width="2"/><text x="1220" y="317" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#155a41">Internet Server</text><text x="1220" y="353" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#155a41">198.51.100.80:443</text><text x="1220" y="391" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#155a41">Return traffic matched</text>
<path d="M360 295 L500 335" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/><path d="M360 420 L500 400" stroke="#8652ab" stroke-width="4" marker-end="url(#a)"/><path d="M920 350 L1070 350" stroke="#17845f" stroke-width="4" marker-end="url(#g)"/><path d="M1070 405 L920 438" stroke="#17845f" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#g)"/>
<rect x="65" y="585" width="1310" height="108" rx="16" fill="#fff3d9" stroke="#e3be65" stroke-width="2"/><text x="1340" y="622" text-anchor="end" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#704e12">تفسیر درست</text><text x="1340" y="654" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#704e12">NAT رمزنگاری نیست و به‌تنهایی جایگزین firewall نیست. ورودی ناخواسته معمولاً به mapping/policy جدا نیاز دارد.</text><text x="1340" y="678" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#704e12">در CGNAT، public IP ممکن است در اختیار اپراتور باشد؛ port forwarding روی CPE به‌تنهایی کافی نیست.</text></svg>