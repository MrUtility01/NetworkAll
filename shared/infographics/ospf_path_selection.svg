<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">OSPF convergence and route installation</title><desc id="d">OSPF neighbor establishment, LSAs, link-state database, SPF calculation and installation into routing and forwarding tables.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker></defs><rect width="1440" height="760" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0d3158"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">OSPF — از همسایگی تا نصب Route</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">Hello، adjacency، LSA flooding، LSDB، SPF، RIB و FIB مراحل یکسانی نیستند</text>
<g font-family="Tahoma,sans-serif"><rect x="65" y="190" width="265" height="130" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="197" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="#17496c">1 · Hello</text><text x="197" y="265" text-anchor="middle" font-size="17" fill="#17496c">Neighbor detection</text><text x="197" y="293" text-anchor="middle" font-size="15" fill="#47677f">Area / timers / auth</text>
<rect x="390" y="190" width="265" height="130" rx="16" fill="#e3f6eb" stroke="#16835d" stroke-width="2"/><text x="522" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="#15583f">2 · Adjacency</text><text x="522" y="265" text-anchor="middle" font-size="17" fill="#15583f">Exchange / flood LSAs</text><text x="522" y="293" text-anchor="middle" font-size="15" fill="#476f60">DR/BDR where applicable</text>
<rect x="715" y="190" width="265" height="130" rx="16" fill="#fff3d9" stroke="#d6ab46" stroke-width="2"/><text x="847" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="#6e4f14">3 · LSDB</text><text x="847" y="265" text-anchor="middle" font-size="17" fill="#6e4f14">Topology per area</text><text x="847" y="293" text-anchor="middle" font-size="15" fill="#876924">Not the routing table</text>
<rect x="1040" y="190" width="330" height="130" rx="16" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="1205" y="232" text-anchor="middle" font-size="21" font-weight="bold" fill="#593579">4 · SPF calculation</text><text x="1205" y="265" text-anchor="middle" font-size="17" fill="#593579">Dijkstra + interface cost</text><text x="1205" y="293" text-anchor="middle" font-size="15" fill="#74588e">Best paths per destination</text></g>
<path d="M330 255 L390 255 M655 255 L715 255 M980 255 L1040 255" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/>
<rect x="220" y="405" width="365" height="125" rx="16" fill="#173c60"/><text x="402" y="450" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#fff">5 · RIB / Routing table</text><text x="402" y="485" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">Best route after comparing route sources</text><text x="402" y="511" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#d6eaff">Administrative distance / preference rules</text>
<rect x="770" y="405" width="365" height="125" rx="16" fill="#e3f6eb" stroke="#16835d" stroke-width="2"/><text x="952" y="450" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#15583f">6 · FIB / Forwarding</text><text x="952" y="485" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#15583f">Next-hop resolution and hardware/software</text><text x="952" y="511" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#15583f">Packet uses installed forwarding state</text>
<path d="M1205 320 L1205 365 L402 365 L402 405" stroke="#2477b7" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M585 467 L770 467" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/>
<rect x="65" y="590" width="1310" height="96" rx="16" fill="#fff" stroke="#d1dfeb" stroke-width="2"/><text x="1340" y="627" text-anchor="end" font-family="Tahoma,sans-serif" font-size="19" font-weight="bold" fill="#163e62">عیب‌یابی OSPF: مرحله‌ای که شکست خورده را مشخص کن</text><text x="1340" y="658" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#334f68">Hello → neighbor state → LSDB consistency → SPF/RIB → next-hop/ARP → FIB & interface counters. رفتارها وابسته به area و network type هستند.</text></svg>