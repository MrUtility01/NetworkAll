<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">Layered network troubleshooting</title><desc id="d">An evidence-first troubleshooting order from physical and wireless connectivity through VLAN, IP, DNS, routing, firewall, transport, TLS and application.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker></defs><rect width="1440" height="900" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0d3158"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">درخت عیب‌یابی شبکه — از پایین به بالا</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">هر مرحله را با شاهد تأیید یا رد کن؛ قبل از جمع‌آوری شواهد کانفیگ را تغییر نده</text>
<g font-family="Tahoma,sans-serif"><rect x="160" y="155" width="1120" height="72" rx="13" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="720" y="185" text-anchor="middle" font-size="20" font-weight="bold" fill="#17496c">1 · Physical / Link / Wi‑Fi association</text><text x="720" y="210" text-anchor="middle" font-size="16" fill="#17496c">Link state · cable/light · RSSI/SNR · association · interface errors</text><path d="M720 227 V255" stroke="#2477b7" stroke-width="3" marker-end="url(#a)"/>
<rect x="160" y="260" width="1120" height="72" rx="13" fill="#e2f6ea" stroke="#17845f" stroke-width="2"/><text x="720" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#155a41">2 · VLAN / L2 / neighbor resolution</text><text x="720" y="315" text-anchor="middle" font-size="16" fill="#155a41">Access/trunk · STP · MAC table · ARP/NDP · duplicate IP</text><path d="M720 332 V360" stroke="#2477b7" stroke-width="3" marker-end="url(#a)"/>
<rect x="160" y="365" width="1120" height="72" rx="13" fill="#fff3d9" stroke="#d6ab46" stroke-width="2"/><text x="720" y="395" text-anchor="middle" font-size="20" font-weight="bold" fill="#6e4f14">3 · IP / DHCP / Gateway / Route</text><text x="720" y="420" text-anchor="middle" font-size="16" fill="#6e4f14">Address/prefix · lease · default route · traceroute · MTU/PMTUD</text><path d="M720 437 V465" stroke="#2477b7" stroke-width="3" marker-end="url(#a)"/>
<rect x="160" y="470" width="1120" height="72" rx="13" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="720" y="500" text-anchor="middle" font-size="20" font-weight="bold" fill="#593579">4 · DNS / Proxy / NAT / Firewall policy</text><text x="720" y="525" text-anchor="middle" font-size="16" fill="#593579">Resolve name and compare IP path · conntrack · rule counters · return path</text><path d="M720 542 V570" stroke="#2477b7" stroke-width="3" marker-end="url(#a)"/>
<rect x="160" y="575" width="1120" height="72" rx="13" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="720" y="605" text-anchor="middle" font-size="20" font-weight="bold" fill="#17496c">5 · TCP/UDP / TLS / Application</text><text x="720" y="630" text-anchor="middle" font-size="16" fill="#17496c">Port/listener · handshake · certificate/time · HTTP status · application logs</text></g>
<rect x="70" y="690" width="1300" height="140" rx="16" fill="#fff" stroke="#d1dfeb" stroke-width="2"/><text x="1335" y="728" text-anchor="end" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#163e62">الگوی شواهد</text><text x="1335" y="761" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">علائم → دادهٔ قابل مشاهده → فرضیه → آزمون تمایزبخش → علت ریشه‌ای → اصلاح کم‌خطر → verification</text><text x="1335" y="792" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#334f68">Windows: ipconfig /all, Get-NetAdapterStatistics, Test-NetConnection · Linux: ip -s link, ip route, resolvectl</text><text x="1335" y="817" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#334f68">Cisco/MikroTik: interface counters, VLAN/MAC/route/conntrack logs؛ فرمان را با سازنده و نسخه تطبیق بده.</text></svg>