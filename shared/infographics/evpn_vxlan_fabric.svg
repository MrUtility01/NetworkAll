<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">EVPN VXLAN underlay and overlay fabric</title><desc id="d">A leaf-spine underlay connects VTEPs. BGP EVPN advertises endpoint reachability; VXLAN encapsulation transports tenant Ethernet frames between VNIs. Underlay reachability does not prove overlay connectivity.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2477b7"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#15845d"/></marker></defs>
<rect width="1440" height="900" rx="28" fill="#f2f7fc"/><rect x="32" y="26" width="1376" height="92" rx="20" fill="#0d3158"/><text x="1368" y="65" text-anchor="end" font-family="Tahoma,sans-serif" font-size="30" font-weight="bold" fill="#fff">EVPN/VXLAN — Underlay و Overlay</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">EVPN در control plane و VXLAN در data plane؛ VNI و VLAN یک مفهوم نیستند.</text>
<rect x="60" y="155" width="610" height="480" rx="20" fill="#fff" stroke="#c8dbea" stroke-width="2"/><text x="638" y="195" text-anchor="end" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#17496c">۱) Underlay — شبکهٔ IP leaf-spine</text>
<rect x="100" y="245" width="190" height="72" rx="14" fill="#fff0d7" stroke="#d2a144" stroke-width="2"/><text x="195" y="289" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#744c09">Spine 1</text>
<rect x="400" y="245" width="190" height="72" rx="14" fill="#fff0d7" stroke="#d2a144" stroke-width="2"/><text x="495" y="289" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#744c09">Spine 2</text>
<rect x="100" y="440" width="190" height="82" rx="14" fill="#dff1ff" stroke="#2477b7" stroke-width="2"/><text x="195" y="472" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#17496c">Leaf 1</text><text x="195" y="500" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">VTEP 10.0.0.11</text>
<rect x="400" y="440" width="190" height="82" rx="14" fill="#dff1ff" stroke="#2477b7" stroke-width="2"/><text x="495" y="472" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#17496c">Leaf 2</text><text x="495" y="500" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">VTEP 10.0.0.12</text>
<path d="M195 317 L195 440 M495 317 L495 440 M290 281 L400 281 M290 466 L400 466" stroke="#2477b7" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M195 317 L495 440 M495 317 L195 440" stroke="#7ba8c7" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
<text x="365" y="566" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">IGP/BGP underlay · loopback reachability · ECMP · MTU</text>
<rect x="700" y="155" width="680" height="480" rx="20" fill="#fff" stroke="#c8e6d8" stroke-width="2"/><text x="1348" y="195" text-anchor="end" font-family="Tahoma,sans-serif" font-size="23" font-weight="bold" fill="#15583f">۲) Overlay — شبکهٔ منطقی tenant</text>
<rect x="750" y="245" width="250" height="78" rx="14" fill="#e2f7e9" stroke="#15845d" stroke-width="2"/><text x="875" y="275" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#15583f">Tenant A · VNI 10100</text><text x="875" y="302" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#15583f">VLAN 10 ↔ VNI 10100</text>
<rect x="1070" y="245" width="250" height="78" rx="14" fill="#e2f7e9" stroke="#15845d" stroke-width="2"/><text x="1195" y="275" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#15583f">Tenant A · Remote VNI</text><text x="1195" y="302" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#15583f">Same logical segment</text>
<rect x="750" y="385" width="250" height="78" rx="14" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="875" y="415" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#593579">Host A</text><text x="875" y="442" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#593579">Inner Ethernet/IP</text>
<rect x="1070" y="385" width="250" height="78" rx="14" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="1195" y="415" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#593579">Host B</text><text x="1195" y="442" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#593579">Remote endpoint</text>
<path d="M875 385 L875 323 M1195 385 L1195 323" stroke="#15845d" stroke-width="4" marker-end="url(#g)"/><path d="M1000 283 L1070 283" stroke="#15845d" stroke-width="4" marker-end="url(#g)"/><text x="1035" y="266" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#15583f">VXLAN</text>
<rect x="750" y="510" width="570" height="72" rx="13" fill="#e5f0ff" stroke="#2477b7" stroke-width="2"/><text x="1035" y="540" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="19" font-weight="bold" fill="#17496c">BGP EVPN Control Plane</text><text x="1035" y="565" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">Type 2: MAC/IP · Type 3: replication membership · Type 5: IP prefix</text>
<path d="M290 480 C510 610 650 610 750 546" stroke="#2477b7" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/><path d="M1000 546 L1070 323" stroke="#2477b7" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/>
<rect x="60" y="675" width="1320" height="155" rx="18" fill="#fff3d9" stroke="#dfb754" stroke-width="2"/><text x="1340" y="713" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#704e12">نکتهٔ عیب‌یابی</text><text x="1340" y="749" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" fill="#704e12">Underlay سالم فقط reachability بین VTEPها را نشان می‌دهد؛ Overlay برای کارکردن به BGP EVPN route، RT/VNI mapping، MAC/IP state و decapsulation درست نیاز دارد.</text><text x="1340" y="782" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#704e12">اگر packet به مقصد نمی‌رسد، Underlay RIB/FIB، EVPN RIB، VNI/VRF mapping، MTU و capture بیرونی/داخلی را جدا بررسی کن.</text><text x="720" y="810" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#876924">RFC 7348 · RFC 7432 · RFC 8365 · نمودار مفهومی است؛ رفتار دقیق به implementation وابسته است.</text></svg>