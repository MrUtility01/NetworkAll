<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">کپسوله‌سازی TCP/IP و Ethernet</title><desc id="d">لایهٔ برنامه داده تولید می‌کند، Transport سربرگ TCP یا UDP، IP سربرگ شبکه و Ethernet سربرگ فریم می‌افزاید و در نهایت بیت‌ها منتقل می‌شوند.</desc>
<rect width="1200" height="720" rx="24" fill="#f5f9fe"/><text x="600" y="48" text-anchor="middle" font-family="Tahoma,Arial" font-size="30" font-weight="700" fill="#123251">Encapsulation: از Payload تا رسانه</text>
<text x="600" y="80" text-anchor="middle" font-family="Tahoma,Arial" font-size="17" fill="#5b7087">نمونهٔ سادهٔ Ethernet + IP + TCP؛ جزئیات به پروتکل، IPv4/IPv6 و نوع لینک وابسته‌اند</text>
<g font-family="Tahoma,Arial" font-size="18" fill="#13324f">
<rect x="65" y="115" width="1070" height="74" rx="14" fill="#eaf4ff" stroke="#afd6f5"/><rect x="82" y="128" width="190" height="48" rx="8" fill="#147dbe"/><text x="177" y="158" text-anchor="middle" fill="#fff" font-weight="700">Application</text><text x="310" y="147" font-size="20" font-weight="700">Data / Payload</text><text x="310" y="171" font-size="15">مثلاً درخواست HTTP یا دادهٔ برنامه</text>
<rect x="65" y="207" width="1070" height="90" rx="14" fill="#effaf3" stroke="#b8e4ca"/><rect x="82" y="228" width="190" height="48" rx="8" fill="#168757"/><text x="177" y="258" text-anchor="middle" fill="#fff" font-weight="700">Transport</text><rect x="305" y="224" width="218" height="56" rx="8" fill="#79cda2"/><text x="414" y="258" text-anchor="middle" fill="#153b2c">TCP / UDP Header</text><rect x="533" y="224" width="500" height="56" rx="8" fill="#fff" stroke="#78c69d"/><text x="783" y="258" text-anchor="middle">Data</text><text x="1050" y="260" font-size="13">Segment / Datagram</text>
<rect x="65" y="315" width="1070" height="90" rx="14" fill="#fff6eb" stroke="#f3d2aa"/><rect x="82" y="336" width="190" height="48" rx="8" fill="#d77a1b"/><text x="177" y="366" text-anchor="middle" fill="#fff" font-weight="700">Internet / IP</text><rect x="305" y="332" width="218" height="56" rx="8" fill="#f3bd7f"/><text x="414" y="366" text-anchor="middle" fill="#55320b">IP Header</text><rect x="533" y="332" width="500" height="56" rx="8" fill="#fff" stroke="#e4ae70"/><text x="783" y="366" text-anchor="middle">Transport Header + Data</text><text x="1050" y="368" font-size="13">Packet</text>
<rect x="65" y="423" width="1070" height="100" rx="14" fill="#f3efff" stroke="#d5c8f5"/><rect x="82" y="449" width="190" height="48" rx="8" fill="#7754bd"/><text x="177" y="479" text-anchor="middle" fill="#fff" font-weight="700">Link / Ethernet</text><rect x="305" y="445" width="170" height="56" rx="8" fill="#b8a1e9"/><text x="390" y="479" text-anchor="middle" fill="#30204f">L2 Header</text><rect x="485" y="445" width="500" height="56" rx="8" fill="#fff" stroke="#ae95e4"/><text x="735" y="479" text-anchor="middle">IP Packet</text><rect x="995" y="445" width="120" height="56" rx="8" fill="#b8a1e9"/><text x="1055" y="479" text-anchor="middle" fill="#30204f">FCS</text><text x="600" y="544" text-anchor="middle" font-size="14">Frame: آدرس MAC لینک جاری، نوع پروتکل و FCS (در Ethernet)</text>
<rect x="65" y="566" width="1070" height="52" rx="13" fill="#102f53"/><text x="600" y="599" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">Physical: بیت‌ها، سیگنال الکتریکی / نوری / رادیویی</text>
<rect x="65" y="637" width="1070" height="56" rx="12" fill="#fff" stroke="#d7e3ef"/><text x="600" y="660" text-anchor="middle" font-size="16">در دریافت، هر لایه Header/Trailer خود را بررسی و حذف می‌کند و Payload را به لایهٔ بالاتر می‌دهد.</text><text x="600" y="682" text-anchor="middle" font-size="15">در هر Router فریم لینک خروجی جدید است؛ آدرس IP معمولاً ثابت می‌ماند مگر NAT، تونل یا پراکسی.</text>
</g></svg>