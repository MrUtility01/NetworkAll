<rect x="1200" y="225" width="190" height="145" rx="16" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="1295" y="261" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#593579">SASE POP</text><text x="1295" y="292" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#593579">ZTNA · SWG</text><text x="1295" y="320" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#593579">CASB · FWaaS</text><text x="1295" y="346" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#593579">Policy + inspection</text>
<path d="M1160 297 L1200 297" stroke="#16845f" stroke-width="4" marker-end="url(#g)"/>
<rect x="1070" y="445" width="320" height="98" rx="16" fill="#e2f7e9" stroke="#16845d" stroke-width="2"/><text x="1230" y="484" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#15583f">Application</text><text x="1230" y="516" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#15583f">Allowed resource · response</text><path d="M1295 370 L1295 445" stroke="#16845f" stroke-width="4" marker-end="url(#g)"/>
<rect x="80" y="455" width="805" height="130" rx="18" fill="#fff" stroke="#c8dbea" stroke-width="2"/><text x="850" y="493" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#17496c">Control plane / Orchestrator</text><text x="850" y="528" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#365675">Policy version · Device config · Tunnel intent · RBAC · Audit</text><text x="850" y="558" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#365675">Controller سالم بودن tunnel و application را به‌تنهایی ثابت نمی‌کند.</text><path d="M452 295 C452 390 452 405 452 455" stroke="#2477b7" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/>
<rect x="60" y="635" width="1320" height="175" rx="18" fill="#fff3d9" stroke="#dfb754" stroke-width="2"/><text x="1340" y="674" text-anchor="end" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#704e12">معیارهای تشخیص و پذیرش</text><text x="1340" y="710" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" fill="#704e12">۱) هویت و device posture  ·  ۲) policy match و application class  ·  ۳) selected path و SLA probe  ·  ۴) tunnel / MTU / return path</text><text x="1340" y="744" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" fill="#704e12">۵) SASE POP و reason log  ·  ۶) پاسخ application و p95/p99 latency  ·  ۷) failover و rollback</text><text x="1340" y="780" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#876924">ZTNA/SASE دسترسی مبتنی بر policy است؛ login موفق با مجازبودن application و transaction موفق یکسان نیست.</text><text x="720" y="862" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#405a73">نمودار مفهومی است؛ مسیر واقعی و ترتیب security serviceها وابسته به پلتفرم/طراحی است.</text></svg>