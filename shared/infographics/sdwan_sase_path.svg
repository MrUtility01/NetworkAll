<rect x="630" y="245" width="240" height="72" rx="14" fill="#fff0d7" stroke="#d2a144" stroke-width="2"/><text x="750" y="275" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#744c09">MPLS</text><text x="750" y="300" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#744c09">Underlay B</text>
<rect x="630" y="340" width="240" height="72" rx="14" fill="#fff0d7" stroke="#d2a144" stroke-width="2"/><text x="750" y="370" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#744c09">5G / Cellular</text><text x="750" y="395" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#744c09">Underlay C</text>
<path d="M570 210 C600 210 600 186 630 186 M570 237 L630 281 M570 265 C600 265 600 375 630 375" stroke="#2477b7" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="930" y="225" width="230" height="145" rx="16" fill="#e5f0ff" stroke="#2477b7" stroke-width="2"/><text x="1045" y="263" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#17496c">Overlay Tunnel</text><text x="1045" y="295" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#17496c">IPsec / SD-WAN overlay</text><text x="1045" y="325" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">Selected by SLA policy</text><text x="1045" y="349" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#17496c">Loss · Latency · Jitter</text>
