<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">SD-WAN and SASE service path</title><desc id="d">Branch client traffic reaches an SD-WAN edge, chooses among Internet, MPLS and 5G underlays by SLA policy, traverses an overlay tunnel and SASE security POP with identity, ZTNA/SWG/FWaaS controls before application access. A separate controller/control plane provides policy.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#2477b7"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#16845f"/></marker></defs>
<rect width="1440" height="900" rx="28" fill="#f2f7fc"/><rect x="32" y="26" width="1376" height="92" rx="20" fill="#0d3158"/><text x="1368" y="65" text-anchor="end" font-family="Tahoma,sans-serif" font-size="30" font-weight="bold" fill="#fff">SD-WAN + SASE — مسیر برنامه، policy و identity</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">Control plane policy را توزیع می‌کند؛ data plane باید با آزمون واقعی تأیید شود.</text>
<rect x="55" y="180" width="220" height="115" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="165" y="220" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#17496c">Branch Client</text><text x="165" y="251" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#17496c">Identity · Device posture</text><text x="165" y="276" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#17496c">Application flow</text>
<rect x="335" y="180" width="235" height="115" rx="16" fill="#e2f7e9" stroke="#16845d" stroke-width="2"/><text x="452" y="220" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#15583f">SD-WAN Edge</text><text x="452" y="251" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#15583f">App class · SLA probes</text><text x="452" y="276" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#15583f">Path selection</text>
<path d="M275 237 L335 237" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/>
