<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">Stateful firewall flow</title><desc id="d">Packets pass through interface and zone policy, connection tracking, rules, logging, and established return traffic evaluation.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker></defs><rect width="1440" height="760" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#0d3158"/><text x="1368" y="66" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">Stateful Firewall — از packet تا decision</text><text x="1368" y="96" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">قانون، وضعیت اتصال، zone/interface و logging را به‌صورت یک زنجیره بررسی کن</text>
<rect x="55" y="265" width="190" height="105" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="150" y="306" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#17496c">Ingress</text><text x="150" y="339" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">Interface / Zone</text>
<rect x="300" y="235" width="230" height="165" rx="16" fill="#fff" stroke="#5a86aa" stroke-width="2"/><text x="415" y="275" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#1b4c70">Connection tracking</text><text x="415" y="310" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#35566f">NEW / ESTABLISHED</text><text x="415" y="340" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#35566f">tuple + TCP state</text><text x="415" y="369" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#6a7f92">timeouts / NAT state</text>
<path d="M245 318 L300 318" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/>
<path d="M530 318 L595 318" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/>
<path d="M650 248 L760 178 L870 248 L760 318 Z" fill="#fff3d9" stroke="#d6ab46" stroke-width="2"/><text x="760" y="245" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" font-weight="bold" fill="#6e4f14">Policy match?</text><text x="760" y="274" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#6e4f14">Rule order / zones</text>
<path d="M870 248 L955 248" stroke="#2477b7" stroke-width="4" marker-end="url(#a)"/><rect x="955" y="200" width="190" height="96" rx="14" fill="#e0f6e9" stroke="#16835d" stroke-width="2"/><text x="1050" y="239" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#15583f">ALLOW</text><text x="1050" y="270" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#15583f">Pass to destination</text>
<path d="M760 318 L760 435 L955 435" fill="none" stroke="#b74141" stroke-width="4" marker-end="url(#a)"/><rect x="955" y="390" width="190" height="92" rx="14" fill="#ffeded" stroke="#c74c4c" stroke-width="2"/><text x="1050" y="428" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#8e2b2b">DROP / REJECT</text><text x="1050" y="458" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#8e2b2b">Log if policy allows</text>
<rect x="1190" y="245" width="195" height="145" rx="16" fill="#edf2f7" stroke="#9eb0c3" stroke-width="2"/><text x="1288" y="283" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#263f58">Evidence</text><text x="1288" y="316" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#40586e">Counters · logs</text><text x="1288" y="344" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#40586e">Conntrack table</text><text x="1288" y="371" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#647b90">Before/after rule diff</text><path d="M1145 248 L1190 285" stroke="#2477b7" stroke-width="3" marker-end="url(#a)"/><path d="M1145 435 L1190 355" stroke="#b74141" stroke-width="3" marker-end="url(#a)"/>
<rect x="65" y="555" width="1310" height="116" rx="16" fill="#fff" stroke="#d1dfeb" stroke-width="2"/><text x="1340" y="594" text-anchor="end" font-family="Tahoma,sans-serif" font-size="20" font-weight="bold" fill="#163e62">بازگشت ترافیک و اصل least privilege</text><text x="1340" y="626" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">پاسخ یک جریان مجاز ممکن است به‌واسطهٔ state پذیرفته شود؛ این مجوز عمومی برای اتصال جدید نیست.</text><text x="1340" y="654" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#334f68">در عیب‌یابی: zone، ترتیب rule، NAT، مسیر برگشت، timeout و log را با packet capture تطبیق بده.</text></svg>