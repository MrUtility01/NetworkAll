<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">VPN and VRRP high availability</title><desc id="desc">Two routers provide a virtual gateway using VRRP and secure site-to-site tunnels; upstream failures, tunnel state, NAT/connection state, and user-facing application health require separate checks.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477b7"/></marker><marker id="gr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16835d"/></marker></defs><rect width="1400" height="820" rx="26" fill="#f2f7fc"/><rect x="28" y="24" width="1344" height="88" rx="18" fill="#0d3158"/><text x="1335" y="62" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">VPN + VRRP — افزونگی فقط با Tunnel Up کامل نمی‌شود</text><text x="1335" y="91" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#d6eaff">Gateway ownership، tunnel، route، NAT/session state و سلامت application را جدا بررسی کن.</text>
<rect x="65" y="170" width="255" height="105" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="192" y="209" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#17496c">LAN / Clients</text><text x="192" y="240" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">Virtual gateway address</text><text x="192" y="260" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#52708a">Application probes</text>
<rect x="385" y="150" width="250" height="135" rx="16" fill="#e1f6e9" stroke="#16835d" stroke-width="2"/><text x="510" y="190" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#15583f">Router A</text><text x="510" y="220" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#15583f">VRRP priority / Master</text><text x="510" y="250" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#15583f">Route · Firewall · NAT</text><text x="510" y="272" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#527d6b">VPN peer / state local</text>
<rect x="385" y="330" width="250" height="135" rx="16" fill="#fff4dd" stroke="#d6ab46" stroke-width="2"/><text x="510" y="370" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" fill="#6e4f14">Router B</text><text x="510" y="400" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#6e4f14">VRRP priority / Backup</text><text x="510" y="430" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#6e4f14">Route · Firewall · NAT</text><text x="510" y="452" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#876924">VPN peer / state local</text>
<path d="M320 223 L385 223 M320 223 L350 223 L350 398 L385 398" fill="none" stroke="#2477b7" stroke-width="4" marker-end="url(#arr)"/>
<rect x="710" y="190" width="240" height="130" rx="16" fill="#f1e8ff" stroke="#8652ab" stroke-width="2"/><text x="830" y="230" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#593579">WAN / ISP</text><text x="830" y="261" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#593579">Upstream reachability</text><text x="830" y="290" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#74588e">Partial failure possible</text>
<path d="M635 215 L710 245 M635 398 L685 398 L685 280 L710 280" fill="none" stroke="#2477b7" stroke-width="4" marker-end="url(#arr)"/>
<rect x="1030" y="190" width="300" height="130" rx="16" fill="#e0f1ff" stroke="#2477b7" stroke-width="2"/><text x="1180" y="230" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#17496c">Remote site</text><text x="1180" y="261" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#17496c">WireGuard / IPsec peer</text><text x="1180" y="290" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#52708a">Inner subnet + services</text>
<path d="M950 245 L1030 245" stroke="#16835d" stroke-width="4" marker-end="url(#gr)"/><text x="990" y="224" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#15583f">Tunnel</text>
<rect x="65" y="525" width="610" height="200" rx="16" fill="#fff" stroke="#cbddea" stroke-width="2"/><text x="645" y="565" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#163e62">چه چیزی را جدا بررسی کنیم؟</text><text x="645" y="600" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">• VRRP: virtual gateway مالک کدام روتر است؟</text><text x="645" y="632" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">• VPN: peer/SA/rekey و route داخل تونل سالم‌اند؟</text><text x="645" y="664" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">• NAT/state: existing sessionها حفظ شده‌اند یا reconnect لازم است؟</text><text x="645" y="696" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#334f68">• Application: سرویس با probe واقعی از client پاسخ می‌دهد؟</text>
<rect x="710" y="525" width="620" height="200" rx="16" fill="#fff4dd" stroke="#d6ab46" stroke-width="2"/><text x="1300" y="565" text-anchor="end" font-family="Tahoma,sans-serif" font-size="21" font-weight="bold" fill="#6e4f14">آزمون Failover قابل قبول</text><text x="1300" y="600" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#765411">۱) ثبت baseline routes/SA/NAT/counters  ۲) قطع کنترل‌شدهٔ master</text><text x="1300" y="632" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#765411">۳) اندازه‌گیری RTO، packet loss و service success  ۴) بررسی existing/new flows</text><text x="1300" y="664" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#765411">۵) بازیابی master و سنجش failback  ۶) rollback و تست مستقل</text><text x="1300" y="696" text-anchor="end" font-family="Tahoma,sans-serif" font-size="15" fill="#876924">VRRP master change، خودکار به معنی sync شدن تمام sessionها نیست.</text>
<text x="700" y="785" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#405a73">در Lab ایزوله اجرا شود؛ syntax، state-sync قابلیت‌ها و limits را برای RouterOS release هدف بررسی کنید.</text></svg>