<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d">
<title id="t">چهار مرحلهٔ DHCP DORA</title><desc id="d">Discover، Offer، Request و Acknowledge و تنظیمات IP که به کلاینت داده می‌شود.</desc>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#4d7396"/></marker></defs><rect width="1200" height="690" rx="24" fill="#f4f8fd"/>
<text x="600" y="48" text-anchor="middle" font-family="Tahoma,Arial" font-size="31" font-weight="700" fill="#123352">DHCP: چهار مرحلهٔ DORA</text>
<text x="600" y="80" text-anchor="middle" font-family="Tahoma,Arial" font-size="17" fill="#61768d">هنگام تخصیص اولیهٔ آدرس؛ تمدید Lease یا حالت‌های دیگر می‌تواند مسیر کوتاه‌تری داشته باشد</text>
<rect x="65" y="112" width="300" height="72" rx="14" fill="#dceeff" stroke="#8dc3ef"/><text x="215" y="142" text-anchor="middle" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#12568c">DHCP Client</text><text x="215" y="166" text-anchor="middle" font-family="Arial" font-size="15" fill="#335d7b">UDP 68</text>
<rect x="835" y="112" width="300" height="72" rx="14" fill="#e1f6e9" stroke="#9dd9b5"/><text x="985" y="142" text-anchor="middle" font-family="Tahoma,Arial" font-size="21" font-weight="700" fill="#176c43">DHCP Server</text><text x="985" y="166" text-anchor="middle" font-family="Arial" font-size="15" fill="#335d7b">UDP 67</text>
<g font-family="Tahoma,Arial"><line x1="365" y1="230" x2="820" y2="230" stroke="#167ec3" stroke-width="4" marker-end="url(#m)"/><rect x="500" y="200" width="185" height="53" rx="12" fill="#167ec3"/><text x="592" y="233" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1 · DISCOVER</text><text x="592" y="275" text-anchor="middle" fill="#33536f" font-size="15">جستجوی سرور</text>
<line x1="820" y1="330" x2="380" y2="330" stroke="#178b61" stroke-width="4" marker-end="url(#m)"/><rect x="500" y="300" width="185" height="53" rx="12" fill="#178b61"/><text x="592" y="333" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2 · OFFER</text><text x="592" y="375" text-anchor="middle" fill="#33536f" font-size="15">پیشنهاد IP و Optionها</text>
<line x1="365" y1="430" x2="820" y2="430" stroke="#cf791d" stroke-width="4" marker-end="url(#m)"/><rect x="500" y="400" width="185" height="53" rx="12" fill="#cf791d"/><text x="592" y="433" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3 · REQUEST</text><text x="592" y="475" text-anchor="middle" fill="#33536f" font-size="15">درخواست انتخاب‌شده</text>
<line x1="820" y1="530" x2="380" y2="530" stroke="#7956bd" stroke-width="4" marker-end="url(#m)"/><rect x="500" y="500" width="185" height="53" rx="12" fill="#7956bd"/><text x="592" y="533" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4 · ACK</text><text x="592" y="575" text-anchor="middle" fill="#33536f" font-size="15">Lease تأیید می‌شود</text>
<rect x="65" y="600" width="1070" height="64" rx="13" fill="#fff" stroke="#d2dfed"/><text x="600" y="626" text-anchor="middle" font-size="17" fill="#193c5e">نتیجه: IP + Prefix/Mask + Default Gateway + DNS + Lease Time (بسته به Optionها)</text><text x="600" y="650" text-anchor="middle" font-size="15" fill="#536b82">اگر سرور در VLAN دیگری است، DHCP Relay / IP Helper ممکن است لازم باشد.</text></g></svg>