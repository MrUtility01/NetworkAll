<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">مسیر یک بسته از کلاینت به سرور</title><desc id="desc">کلاینت، اکسس پوینت، سوئیچ، روتر، ONT یا مودم، شبکهٔ ISP و سرور مقصد. مسیر برگشت جداگانه نشان داده شده است.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0c83d9"/></marker><marker id="back" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b61c8"/></marker><linearGradient id="head" x2="1" y2="1"><stop stop-color="#063b77"/><stop offset="1" stop-color="#168bd2"/></linearGradient></defs>
<rect width="1500" height="760" rx="24" fill="#f4f8fd"/>
<rect x="0" y="0" width="1500" height="85" rx="22" fill="url(#head)"/>
<text x="750" y="52" text-anchor="middle" font-size="32" font-family="Tahoma,Arial" font-weight="700" fill="#fff">مسیر Packet در یک شبکهٔ معمولی</text>
<text x="750" y="125" text-anchor="middle" font-size="17" font-family="Tahoma,Arial" fill="#51677f">نمای منطقی؛ ترتیب فیزیکی و مرز تجهیزات به توپولوژی واقعی وابسته است</text>
<g><rect x="22" y="190" width="178" height="210" rx="16" fill="#fff" stroke="#168bd2" stroke-width="2"/><rect x="22" y="190" width="178" height="48" rx="14" fill="#168bd2"/><rect x="22" y="222" width="178" height="16" fill="#168bd2"/><text x="111" y="220" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="700">CLIENT</text><text x="111" y="282" text-anchor="middle" fill="#122d4b" font-size="21" font-family="Tahoma,Arial" font-weight="700">کلاینت</text><text x="111" y="322" text-anchor="middle" fill="#526a83" font-size="16" font-family="Tahoma,Arial">داده + IP مقصد</text><circle cx="111" cy="366" r="15" fill="#168bd2"/><text x="111" y="372" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">1</text></g><g><rect x="232" y="190" width="178" height="210" rx="16" fill="#fff" stroke="#0c9a98" stroke-width="2"/><rect x="232" y="190" width="178" height="48" rx="14" fill="#0c9a98"/><rect x="232" y="222" width="178" height="16" fill="#0c9a98"/><text x="321" y="220" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="700">WI-FI AP</text><text x="321" y="282" text-anchor="middle" fill="#122d4b" font-size="21" font-family="Tahoma,Arial" font-weight="700">اکسس پوینت</text><text x="321" y="322" text-anchor="middle" fill="#526a83" font-size="16" font-family="Tahoma,Arial">پل WLAN ↔ LAN</text><circle cx="321" cy="366" r="15" fill="#0c9a98"/><text x="321" y="372" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">2</text></g><g><rect x="442" y="190" width="178" height="210" rx="16" fill="#fff" stroke="#12805c" stroke-width="2"/><rect x="442" y="190" width="178" height="48" rx="14" fill="#12805c"/><rect x="442" y="222" width="178" height="16" fill="#12805c"/><text x="531" y="220" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="700">L2 SWITCH</text><text x="531" y="282" text-anchor="middle" fill="#122d4b" font-size="21" font-family="Tahoma,Arial" font-weight="700">سوئیچ</text><text x="531" y="322" text-anchor="middle" fill="#526a83" font-size="16" font-family="Tahoma,Arial">MAC + VLAN</text><circle cx="531" cy="366" r="15" fill="#12805c"/><text x="531" y="372" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">3</text></g><g><rect x="652" y="190" width="178" height="210" rx="16" fill="#fff" stroke="#df7c22" stroke-width="2"/><rect x="652" y="190" width="178" height="48" rx="14" fill="#df7c22"/><rect x="652" y="222" width="178" height="16" fill="#df7c22"/><text x="741" y="220" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="700">ROUTER / FW</text><text x="741" y="282" text-anchor="middle" fill="#122d4b" font-size="21" font-family="Tahoma,Arial" font-weight="700">روتر / فایروال</text><text x="741" y="322" text-anchor="middle" fill="#526a83" font-size="16" font-family="Tahoma,Arial">Route + Policy</text><circle cx="741" cy="366" r="15" fill="#df7c22"/><text x="741" y="372" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">4</text></g><g><rect x="862" y="190" width="178" height="210" rx="16" fill="#fff" stroke="#8058c9" stroke-width="2"/><rect x="862" y="190" width="178" height="48" rx="14" fill="#8058c9"/><rect x="862" y="222" width="178" height="16" fill="#8058c9"/><text x="951" y="220" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="700">ONT / MODEM</text><text x="951" y="282" text-anchor="middle" fill="#122d4b" font-size="21" font-family="Tahoma,Arial" font-weight="700">ONT / مودم</text><text x="951" y="322" text-anchor="middle" fill="#526a83" font-size="16" font-family="Tahoma,Arial">رسانهٔ دسترسی</text><circle cx="951" cy="366" r="15" fill="#8058c9"/><text x="951" y="372" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">5</text></g><g><rect x="1072" y="190" width="178" height="210" rx="16" fill="#fff" stroke="#3975bd" stroke-width="2"/><rect x="1072" y="190" width="178" height="48" rx="14" fill="#3975bd"/><rect x="1072" y="222" width="178" height="16" fill="#3975bd"/><text x="1161" y="220" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="700">ISP</text><text x="1161" y="282" text-anchor="middle" fill="#122d4b" font-size="21" font-family="Tahoma,Arial" font-weight="700">شبکهٔ اپراتور</text><text x="1161" y="322" text-anchor="middle" fill="#526a83" font-size="16" font-family="Tahoma,Arial">مسیرهای بین‌شبکه‌ای</text><circle cx="1161" cy="366" r="15" fill="#3975bd"/><text x="1161" y="372" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">6</text></g><g><rect x="1282" y="190" width="178" height="210" rx="16" fill="#fff" stroke="#0b6c8d" stroke-width="2"/><rect x="1282" y="190" width="178" height="48" rx="14" fill="#0b6c8d"/><rect x="1282" y="222" width="178" height="16" fill="#0b6c8d"/><text x="1371" y="220" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial" font-weight="700">SERVER</text><text x="1371" y="282" text-anchor="middle" fill="#122d4b" font-size="21" font-family="Tahoma,Arial" font-weight="700">سرور مقصد</text><text x="1371" y="322" text-anchor="middle" fill="#526a83" font-size="16" font-family="Tahoma,Arial">پاسخ برنامه</text><circle cx="1371" cy="366" r="15" fill="#0b6c8d"/><text x="1371" y="372" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">7</text></g>
<line x1="200" y1="292" x2="225" y2="292" stroke="#0c83d9" stroke-width="5" marker-end="url(#arrow)"/><line x1="410" y1="292" x2="435" y2="292" stroke="#0c83d9" stroke-width="5" marker-end="url(#arrow)"/><line x1="620" y1="292" x2="645" y2="292" stroke="#0c83d9" stroke-width="5" marker-end="url(#arrow)"/><line x1="830" y1="292" x2="855" y2="292" stroke="#0c83d9" stroke-width="5" marker-end="url(#arrow)"/><line x1="1040" y1="292" x2="1065" y2="292" stroke="#0c83d9" stroke-width="5" marker-end="url(#arrow)"/><line x1="1250" y1="292" x2="1275" y2="292" stroke="#0c83d9" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1380 435 C1380 490 122 490 122 435" fill="none" stroke="#7b61c8" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#back)"/>
<text x="750" y="468" text-anchor="middle" font-size="18" fill="#6449b5" font-family="Tahoma,Arial" font-weight="700">پاسخ از سرور برمی‌گردد؛ مسیر فیزیکی لزوماً دقیقاً قرینه نیست</text>
<g font-family="Tahoma,Arial"><rect x="25" y="520" width="465" height="200" rx="18" fill="#e7f4ff" stroke="#badcf6"/><text x="257" y="558" text-anchor="middle" font-size="22" font-weight="700" fill="#075a9c">در لایهٔ پیوند (L2)</text><text x="257" y="598" text-anchor="middle" font-size="18" fill="#254866">هر لینک فریم خودش را دارد</text><text x="257" y="632" text-anchor="middle" font-size="17" fill="#254866">MAC مبدأ/مقصد محلی + VLAN</text><text x="257" y="670" text-anchor="middle" font-size="16" fill="#254866">سوئیچ معمولاً IP را برای Route انتخاب نمی‌کند</text>
<rect x="518" y="520" width="465" height="200" rx="18" fill="#eaf8f0" stroke="#bce8cf"/><text x="750" y="558" text-anchor="middle" font-size="22" font-weight="700" fill="#147548">در روتر (L3)</text><text x="750" y="598" text-anchor="middle" font-size="18" fill="#254866">جدول Route + next hop/interface</text><text x="750" y="632" text-anchor="middle" font-size="17" fill="#254866">کاهش TTL / Hop Limit</text><text x="750" y="670" text-anchor="middle" font-size="16" fill="#254866">سربرگ L2 خروجی دوباره ساخته می‌شود</text>
<rect x="1012" y="520" width="463" height="200" rx="18" fill="#fff2e5" stroke="#f7d4b0"/><text x="1243" y="558" text-anchor="middle" font-size="22" font-weight="700" fill="#a85814">نکته‌های معماری</text><text x="1243" y="598" text-anchor="middle" font-size="18" fill="#254866">NAT فقط اگر تنظیم شده باشد</text><text x="1243" y="632" text-anchor="middle" font-size="17" fill="#254866">ONT / مودم ممکن است با روتر یکی باشد</text><text x="1243" y="670" text-anchor="middle" font-size="16" fill="#254866">ARP / IPv6 ND برای یافتن همسایه</text></g>
</svg>