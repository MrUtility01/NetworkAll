<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">ARP and IPv6 Neighbor Discovery</title><desc id="d">Compare IPv4 ARP with IPv6 Neighbor Discovery, including why an off-subnet destination resolves the gateway's link-layer address.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1876b9"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17835e"/></marker></defs>
<rect width="1440" height="760" rx="28" fill="#f2f7fc"/><rect x="32" y="28" width="1376" height="94" rx="20" fill="#0d3158"/><text x="1368" y="68" text-anchor="end" font-family="Tahoma,sans-serif" font-size="29" font-weight="bold" fill="#fff">ARP در IPv4 و Neighbor Discovery در IPv6</text><text x="1368" y="101" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#d6eaff">حل آدرس لایهٔ پیوند فقط روی همان لینک؛ نه کشف MAC هر مقصد اینترنتی</text>
<rect x="48" y="150" width="652" height="500" rx="18" fill="#fff" stroke="#c8dcee" stroke-width="2"/><text x="664" y="192" text-anchor="end" font-family="Tahoma,sans-serif" font-size="24" font-weight="bold" fill="#12466e">IPv4 — ARP</text>
<rect x="92" y="230" width="210" height="92" rx="14" fill="#e5f3ff" stroke="#1876b9" stroke-width="2"/><text x="197" y="266" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="19" fill="#143c60">Host A</text><text x="197" y="295" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#143c60">192.168.10.20</text>
<rect x="446" y="230" width="210" height="92" rx="14" fill="#e8f8f0" stroke="#17835e" stroke-width="2"/><text x="551" y="266" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="19" fill="#155b43">Gateway</text><text x="551" y="295" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#155b43">192.168.10.1</text>
<path d="M302 244 C350 205 398 205 446 244" stroke="#1876b9" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="374" y="215" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#155b87">ARP Request</text><text x="374" y="238" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#155b87">Broadcast: Who has .1?</text>
<path d="M446 307 C398 354 350 354 302 307" stroke="#17835e" stroke-width="3" fill="none" marker-end="url(#g)"/><text x="374" y="372" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#12664b">ARP Reply · Unicast</text>
<rect x="92" y="420" width="564" height="82" rx="12" fill="#fff7df" stroke="#e2bb58"/><text x="636" y="454" text-anchor="end" font-family="Tahoma,sans-serif" font-size="19" fill="#6f4b10">جدول همسایه / ARP cache</text><text x="636" y="483" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#6f4b10">192.168.10.1 → MAC دروازه</text>
<rect x="92" y="526" width="564" height="92" rx="12" fill="#f0f4f8"/><text x="636" y="560" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" font-weight="bold" fill="#2c4258">مقصد بیرون subnet است؟</text><text x="636" y="590" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#2c4258">MAC دروازه resolve می‌شود؛ IP مقصد همچنان سرور دوردست است.</text>
<rect x="740" y="150" width="652" height="500" rx="18" fill="#fff" stroke="#c8e6d8" stroke-width="2"/><text x="1356" y="192" text-anchor="end" font-family="Tahoma,sans-serif" font-size="24" font-weight="bold" fill="#11634a">IPv6 — Neighbor Discovery (NDP)</text>
<rect x="784" y="230" width="210" height="92" rx="14" fill="#e5f3ff" stroke="#1876b9" stroke-width="2"/><text x="889" y="266" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="19" fill="#143c60">Host A</text><text x="889" y="295" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#143c60">2001:db8:10::20</text>
<rect x="1138" y="230" width="210" height="92" rx="14" fill="#e8f8f0" stroke="#17835e" stroke-width="2"/><text x="1243" y="266" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="19" fill="#155b43">Gateway</text><text x="1243" y="295" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="16" fill="#155b43">fe80::1</text>
<path d="M994 244 C1042 205 1090 205 1138 244" stroke="#1876b9" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1066" y="215" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#155b87">Neighbor Solicitation</text><text x="1066" y="238" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="14" fill="#155b87">Solicited-node multicast</text>
<path d="M1138 307 C1090 354 1042 354 994 307" stroke="#17835e" stroke-width="3" fill="none" marker-end="url(#g)"/><text x="1066" y="372" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#12664b">Neighbor Advertisement</text>
<rect x="784" y="420" width="564" height="82" rx="12" fill="#fff7df" stroke="#e2bb58"/><text x="1328" y="454" text-anchor="end" font-family="Tahoma,sans-serif" font-size="19" fill="#6f4b10">Neighbor cache</text><text x="1328" y="483" text-anchor="end" font-family="Tahoma,sans-serif" font-size="17" fill="#6f4b10">IPv6 address → link-layer address</text>
<rect x="784" y="526" width="564" height="92" rx="12" fill="#f0f4f8"/><text x="1328" y="560" text-anchor="end" font-family="Tahoma,sans-serif" font-size="18" font-weight="bold" fill="#2c4258">NDP فقط مع ARP فرق نام ندارد</text><text x="1328" y="590" text-anchor="end" font-family="Tahoma,sans-serif" font-size="16" fill="#2c4258">ICMPv6 است و قابلیت‌های کشف روتر و بررسی تکرار آدرس هم دارد.</text>
<text x="720" y="710" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="17" fill="#405a73">آزمایش: ip neigh / arp -a · مراقب cache قدیمی، VLAN اشتباه و IP تکراری باشید.</text></svg>