<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">ظرفیت سازمانی — NetworkAll</title>
<desc id="desc">RAM باید working set، VM density، peak use، headroom و growth را پوشش دهد؛ paging/memory pressure می‌تواند latency بسازد.</desc>
<rect width="1440" height="480" rx="24" fill="#f8fafc"/>
<text x="720" y="48" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">ظرفیت سازمانی</text>
<text x="720" y="82" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="15" fill="#475569">فصل ۰۱ · حافظه · نمودار مفهومی</text>
<rect x="40" y="150" width="290" height="118" rx="16" fill="#dbeafe" stroke="#64748b" stroke-width="2"/>
<text x="185" y="199" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Input / premise</text>
<text x="185" y="231" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#334155">مرحله 1</text>
<path d="M 330 209 H 381 l -10 -8 m 10 8 l -10 8" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="395" y="150" width="290" height="118" rx="16" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="540" y="199" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Mechanism / decision</text>
<text x="540" y="231" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#334155">مرحله 2</text>
<path d="M 685 209 H 736 l -10 -8 m 10 8 l -10 8" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="750" y="150" width="290" height="118" rx="16" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="895" y="199" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="600" fill="#0f172a">State / measurement</text>
<text x="895" y="231" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#334155">مرحله 3</text>
<path d="M 1040 209 H 1091 l -10 -8 m 10 8 l -10 8" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="1105" y="150" width="290" height="118" rx="16" fill="#ede9fe" stroke="#64748b" stroke-width="2"/>
<text x="1250" y="199" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="600" fill="#0f172a">Output / verify</text>
<text x="1250" y="231" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#334155">مرحله 4</text>
<rect x="40" y="322" width="1360" height="80" rx="14" fill="#e2e8f0"/>
<text x="720" y="352" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">نکتهٔ عملی</text>
<text x="720" y="379" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#334155">RAM آزاد کم به‌تنهایی کمبود را ثابت نمی‌کند.</text>
