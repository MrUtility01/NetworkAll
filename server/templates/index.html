<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetworkAll — دانشنامه جامع شبکه</title>
  <link rel="stylesheet" href="/static/app.css?v=20261014-learning-jalali-packet" />
  <link rel="stylesheet" href="/static/sync_ui.css?v=20261014-light" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <strong>NetworkAll</strong>
        <span id="stats" class="muted">در حال آماده‌سازی…</span>
      </div>
      <div class="search-box">
        <input id="q" type="search" placeholder="جستجو در عناوین و محتوا…" autocomplete="off" />
        <button id="btnSearch" type="button">جستجو</button>
      </div>
      <div class="top-actions">
        <button id="btnScenarios" type="button" class="ghost">سناریوهای واقعی</button>
        <button id="btnLearning" type="button" class="ghost">مرکز یادگیری</button>
        <button type="button" class="ghost" onclick="window.location.href='/diagrams'">دیاگرام و عیب‌یابی</button>
        <button id="btnQuiz" type="button" class="ghost">مرکز آزمون</button>
        <a href="/workspace?tab=tasks">مدیریت کارها</a>
        <a href="/workspace?tab=knowledge">مدیریت دانش</a>
        <button type="button" class="ghost" onclick="window.location.href='/logout'">قفل برنامه</button>
      </div>
    </header>

    <div id="syncBar" class="sync-bar">
      <div class="sync-item">
        <span class="sync-label">LAN IP</span>
        <code id="lanIp">—</code>
        <button type="button" id="btnCopyIp" class="ghost tiny">کپی</button>
      </div>
      <div class="sync-item">
        <span class="sync-label">اندروید</span>
        <code id="androidHint">http://IP:86</code>
      </div>
      <div class="sync-item">
        <button type="button" id="btnSyncStatus">وضعیت Sync</button>
        <span id="syncStatus" class="muted">—</span>
      </div>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="side-head">فهرست ۶۸ فصل</div>
        <div id="chapters" class="tree"></div>
      </aside>
      <section class="content">
        <div id="breadcrumb" class="breadcrumb">یک فصل را انتخاب کنید — بارگذاری تنبل</div>
        <div id="viewer" class="viewer">
          <div class="welcome">
            <h1>NetworkAll — نسخه وب + Sync LAN</h1>
            <p>IP بالا را در اپ اندروید وارد کنید و همگام‌سازی بزنید.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="/static/app.js?v=20261014-learning-jalali-packet"></script>
  <script src="/static/sync_ui.js?v=20261014-light"></script>
</body>
</html>
