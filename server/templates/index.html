<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دایرةالمعارف جامع شبکه — نسخه وب</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="stylesheet" href="/static/sync_ui.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <strong>دایرةالمعارف شبکه</strong>
        <span id="stats" class="muted">در حال آماده‌سازی…</span>
      </div>
      <div class="search-box">
        <input id="q" type="search" placeholder="جستجو در عناوین و محتوا…" autocomplete="off" />
        <button id="btnSearch" type="button">جستجو</button>
      </div>
      <div class="top-actions">
        <button id="btnScenarios" type="button" class="ghost">Capstoneها</button>
        <a href="/infographics" class="ghost" style="display:inline-block;text-decoration:none;padding:9px 12px;border-radius:8px">اینفوگرافیک‌های تصویری</a>
        <a href="/planner" class="ghost" style="display:inline-block;text-decoration:none;padding:9px 12px;border-radius:8px">تقویم شمسی و برنامه‌ریز</a>
        <button id="btnReseed" type="button" class="ghost danger">بررسی / بازیابی ایمن ساختار</button>
      </div>
    </header>

    <div id="syncBar" class="sync-bar">
      <div class="sync-item">
        <span class="sync-label">LAN IP</span>
        <code id="lanIp">—</code>
        <button type="button" id="btnCopyIp" class="ghost tiny">کپی</button>
      </div>
      <div class="sync-item">
        <span class="sync-label">اندروید</span>
        <code id="androidHint">http://IP:5050</code>
      </div>
      <div class="sync-item">
        <button type="button" id="btnSyncStatus">وضعیت Sync</button>
        <span id="syncStatus" class="muted">—</span>
      </div>
    </div>

    <div class="main">
      <aside class="sidebar">
        <div class="side-head">فهرست ۶۸ فصل</div>
        <div id="chapters" class="tree"></div>
      </aside>
      <section class="content">
        <div id="breadcrumb" class="breadcrumb">یک فصل را انتخاب کنید — بارگذاری تنبل</div>
        <div id="viewer" class="viewer">
          <div class="welcome">
            <h1>نسخه وب + تقویم شمسی + Sync محلی</h1>
            <p>IP بالا را در اپ اندروید وارد کنید و همگام‌سازی بزنید.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="/static/app.js"></script>
  <script src="/static/sync_ui.js"></script>
</body>
</html>
